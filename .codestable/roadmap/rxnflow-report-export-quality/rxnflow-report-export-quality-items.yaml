roadmap: rxnflow-report-export-quality
created: 2026-05-21

items:
  - slug: export-energy-table-contract
    description: 固定能量表列、row builder、单位/缺失语义和用户 workbook 字段映射，保证第一列为结构名称
    depends_on: []
    status: done
    feature: 2026-05-21-export-energy-table-contract
    minimal_loop: true
    notes: 已落地 energy-table-v1、列 key helper、用户样表 header normalization、manual/profile merge 契约和 XLSX artifact schema metadata；首轮不复制 workbook 原文件，不开放 CSV/CDX

  - slug: export-xlsx-workbook-template
    description: 强化 XLSX workbook writer，补表格布局、warnings sheet、结构化测试和 spreadsheet visual QA
    depends_on: [export-energy-table-contract]
    status: done
    feature: 2026-05-21-export-xlsx-workbook-template
    minimal_loop: false
    notes: 已落地 XLSX group header、autofilter、freeze pane、列宽策略、Export Metadata sheet 和 workbook XML 结构回归；当前环境无 soffice/pdftoppm，未做真实渲染截图；CSV 仍只保留复用 table contract 的后续入口

  - slug: export-energy-diagram-route-layout
    description: 提升 PNG/CDXML 共用 EnergyDiagramRoute 布局，处理长 label、missing point、相同能量和 y-axis padding
    depends_on: [export-energy-table-contract]
    status: done
    feature: 2026-05-21-export-energy-diagram-route-layout
    minimal_loop: false
    notes: 已落地 EnergyDiagramRoute padded energy bounds、state anchors、PNG/CDXML anchor consumption、same-energy/all-missing 回归；不重新计算 profile，不做 label collision avoidance

  - slug: export-cdxml-chemdraw-compat
    description: 补 CDXML ChemDraw 兼容性结构回归，固定 font/color/page/graphic/arrow/text 对象语义，并明确 CDX 不支持边界
    depends_on: [export-energy-diagram-route-layout]
    status: done
    feature: 2026-05-21-export-cdxml-chemdraw-compat
    minimal_loop: false
    notes: 已落地 CDXML document/page/group attributes、generated id uniqueness、graphic/arrow/text Z/BoundingBox/LineWidth/text shape 回归和 CDX unsupported guard；只参考 Energy_Diagram_Plotter_CDXML 的对象结构，不引入其 PyQt UI、随机 id 或全局脚本

  - slug: web-report-export-verification
    description: 补 Web Report Export Panel fixture/local-http E2E，覆盖 PNG/CDXML/XLSX inline download、persisted checksum、metadata、warnings 和窄屏布局
    depends_on: [export-xlsx-workbook-template, export-cdxml-chemdraw-compat]
    status: done
    feature: 2026-05-21-web-report-export-verification
    minimal_loop: false
    notes: 已落地 fixture/local-http Report Export Panel 验证，覆盖 PNG/CDXML/XLSX download MIME、writer metadata、energy-table-v1 schema metadata、browser-local persisted checksum、unsupported cdx persistence guard、include-bytes-off、persistence failure 和窄屏 E2E；Web 仍不生成 bytes，只展示和持久化 ShellResponse artifact projection

  - slug: report-export-guides
    description: 补开发者和用户指南，说明表格字段、ChemDraw/CDXML 打开方式、CDX 边界和 artifact 保存路径
    depends_on: [web-report-export-verification]
    status: done
    feature: 2026-05-21-report-export-guides
    minimal_loop: false
    notes: 已补 docs/dev/report-export-artifacts.md 和 docs/user/report-export-artifacts.md，覆盖 core/Shell/Web artifact contract、Energy Table 字段口径、Web 操作、PNG/CDXML/XLSX 用途、CDXML/CDX 边界、Download/Persisted/Checksum/Metadata/Warnings 语义和 exports 保存路径

  - slug: ir-gas-solution-workbook-template
    description: 用 Ir 真实 gas/solution Gaussian logs 和 Shermo_New 样表补通用 XLSX 模板页，输出 Egas/Ggas/Ggas+1M/Esol/Gsol 并保留公式
    depends_on: [export-energy-table-contract, export-xlsx-workbook-template]
    status: done
    feature: null
    minimal_loop: false
    notes: 本轮直接落地，入口为 rxnflow.solution_pairs.with_paired_solution_free_energies 与 rxnflow.export 的 Shermo_New sheet；Gsol 公式固定为 Ggas+1M - Egas + Esol，真实 Ir 导出验证通过，Shermo/Whitesides 列保留空白

  - slug: shermo-whitesides-export-columns
    description: 后续把 Shermo 和 Whitesides 校正数据接入能量表显示与 XLSX/CSV 导出
    depends_on: [ir-gas-solution-workbook-template]
    status: planned
    feature: null
    minimal_loop: false
    notes: 用户允许先不实现；参考 https://831447.xyz/p/2025/shermo 与 https://831447.xyz/p/2025/whitesides，需先在 energy chemistry semantics 中建立校正模型，再接入导出列
