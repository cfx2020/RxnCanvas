roadmap: rxnflow-parser-real-output-compatibility
created: 2026-05-21

items:
  - slug: parser-source-inventory
    description: 建立 MAPLE/cclib/ASE 公开样例来源清单，记录 URL、commit、license、文件类型、大小、hash、fixture policy
    depends_on: []
    status: done
    feature: 2026-05-21-parser-source-inventory
    minimal_loop: true
    notes: 最小闭环；先解决真实样例能不能进入仓库和哪些只能 reference-only 的问题

  - slug: parser-corpus-source-metadata
    description: 扩展 manifest/support matrix 校验，支持 source hash、size、upstream path 和 vendored-third-party 必填字段
    depends_on: [parser-source-inventory]
    status: done
    feature: 2026-05-21-parser-corpus-source-metadata
    minimal_loop: false
    notes: 为真实/公开 fixture 接入提供统一元数据 guard

  - slug: maple-public-example-inventory
    description: 对 MAPLE example 文件族做任务级分类，把 .out、.xyz、.sum、AutoNEB JSON、MD thermo 等登记到 support matrix reference/candidate 状态
    depends_on: [parser-source-inventory]
    status: done
    feature: 2026-05-21-maple-public-example-inventory
    minimal_loop: false
    notes: 不直接增强 parser，先固定 MAPLE 任务语义与许可证边界

  - slug: maple-out-real-fixtures
    description: 选择少量可再分发 MAPLE .out / final .xyz 样例进入 fixture corpus，补 golden snapshots 和 parser 回归
    depends_on: [parser-corpus-source-metadata, maple-public-example-inventory]
    status: done
    feature: 2026-05-21-maple-out-real-fixtures
    minimal_loop: false
    notes: MAPLE public examples 许可证/banner 边界不适合直接 vendor；已用项目内 synthetic-derived shape fixture 覆盖 sp .out 和 opt final .xyz 最小解析形状

  - slug: maple-path-output-semantics
    description: 设计并验证 MAPLE IRC/NEB/String/AutoNEB path .xyz 的 frame label、energy、direction/topology 支持边界
    depends_on: [maple-public-example-inventory]
    status: done
    feature: 2026-05-22-maple-path-output-semantics
    minimal_loop: false
    notes: 已用项目内 MAPLE path-family synthetic-derived fixture 固定 frame label/Hartree energy 逐帧解析边界；仍不生成 ReactionPath、direction/topology 或 TS candidate，路径拓扑模型需要另起 graph/import feature

  - slug: cclib-public-gaussian-orca-fixtures
    description: 从 cclib 公开样例或等价可再分发来源接入 Gaussian/ORCA 最小真实输出，固定 method、charge/spin、geometry 和 energy snapshot
    depends_on: [parser-corpus-source-metadata]
    status: done
    feature: 2026-05-22-cclib-public-gaussian-orca-fixtures
    minimal_loop: false
    notes: cclib-data license 未在记录 commit/source API 中明确，已采用项目内 Gaussian/ORCA public-shape synthetic-derived fixtures 固定 adapter method、charge/spin、geometry 和 energy 投影；未 vendor cclib-data originals

  - slug: ase-extxyz-real-variant-fixtures
    description: 接入真实 extxyz 变体，覆盖多帧、metadata、calculator energy、charge/spin、missing energy 和 unit warning
    depends_on: [parser-corpus-source-metadata]
    status: done
    feature: 2026-05-22-ase-extxyz-real-variant-fixtures
    minimal_loop: false
    notes: 已用项目内 ASE extxyz multi-frame variant fixture 固定 metadata、calculator energy fallback、charge/spin、missing energy 和 eV → Hartree unit warning；未 vendor 外部 extxyz 数据集

  - slug: real-output-import-preview-regression
    description: 用真实/公开 fixture 跑 ImportRegistryWorkflow 与 Platform Shell import.preview 回归，确认 preview projection 保真
    depends_on: [maple-out-real-fixtures, cclib-public-gaussian-orca-fixtures, ase-extxyz-real-variant-fixtures]
    status: done
    feature: 2026-05-22-real-output-import-preview-regression
    minimal_loop: false
    notes: 已用 parser fixture corpus 覆盖 Workflow Preview Projection 和 Platform Shell import.preview projection，固定 parser metadata、object_count、warnings、raw_resource id/path/checksum 和 expected-error；不确认导入、不登记对象

  - slug: parser-real-output-guides
    description: 更新开发者/用户指南，说明真实/公开 fixture-backed 支持边界、reference-only 条目和贡献样例流程
    depends_on: [real-output-import-preview-regression]
    status: done
    feature: 2026-05-22-parser-real-output-guides
    minimal_loop: false
    notes: 已新增 docs/user/parser-output-support.md，并同步 docs/dev/parser-fixture-corpus.md；说明 fixture-backed 支持边界、reference-only/candidate 区别、warning/error 含义和真实样例贡献 checklist
