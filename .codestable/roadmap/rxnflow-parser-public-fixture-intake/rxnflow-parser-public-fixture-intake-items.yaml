roadmap: rxnflow-parser-public-fixture-intake
created: 2026-06-02

items:
  - slug: parser-public-fixture-decision-ledger
    description: 新增 public fixture decision ledger，记录 MAPLE/cclib/extxyz 候选文件的 evidence、decision、promotion 状态和 fallback
    depends_on: []
    status: done
    feature: 2026-06-02-parser-public-fixture-decision-ledger
    minimal_loop: true
    notes: 最小闭环；先建立 gate，避免 review-required source 被误 vendor

  - slug: parser-public-candidate-fetch-verify
    description: 提供 dev-only fetch/hash verify workflow，按 sources.yaml 的 source_id/file_id 拉取候选并校验 sha256
    depends_on: [parser-public-fixture-decision-ledger]
    status: done
    feature: 2026-06-02-parser-public-candidate-fetch-verify
    minimal_loop: false
    notes: 已落地 dev-only request/result helper；普通测试不访问网络、不写 fixture corpus，只复核调用方提供 bytes 是否匹配 source inventory

  - slug: maple-public-candidate-resolution
    description: 对 MAPLE sp/opt/path/frequency/MD/scan candidates/reference files 做逐项 decision，能 promotion 的生成 fixture，不能 promotion 的写明 synthetic-only/reference-only fallback
    depends_on: [parser-public-fixture-decision-ledger, parser-public-candidate-fetch-verify]
    status: done
    feature: 2026-06-02-maple-public-candidate-resolution
    minimal_loop: false
    notes: 已落地测试侧 MAPLE resolution summary/guards；当前无 MAPLE originals promoted，3 个 candidate 全 blocked，14 个 reference-only anchors 全覆盖，public originals 未进入 executable fixture_ids

  - slug: cclib-public-candidate-resolution
    description: 复核 cclib-data Gaussian/ORCA candidates 的许可证与 hash，决定是否 promotion；不能 promotion 时固定 synthetic-derived fallback 口径
    depends_on: [parser-public-fixture-decision-ledger, parser-public-candidate-fetch-verify]
    status: done
    feature: 2026-06-02-cclib-public-candidate-resolution
    minimal_loop: false
    notes: 已落地测试侧 cclib-data resolution summary/guards；当前无 cclib-data originals promoted，2 个 Gaussian candidate 与 2 个 ORCA candidate 全 blocked，2 个 reference-only anchors 全覆盖，public originals 未进入 executable fixture_ids

  - slug: extxyz-public-variant-intake
    description: 建立公开或用户授权 extxyz 样例 intake 流程，并选择少量真实变体补 fixture 或 known_limits
    depends_on: [parser-public-fixture-decision-ledger]
    status: done
    feature: 2026-06-02-extxyz-public-variant-intake
    minimal_loop: false
    notes: 已落地 extxyz variant intake summary/guards；当前 4 个 project-authored extxyz variants 全 allowed/promoted，新增 lattice/PBC/forces/stress/magmoms advanced-field fixture，但 advanced fields 仍为 known-limits 不映射到领域模型

  - slug: parser-public-fixture-promotion-adapter
    description: 统一校验 promoted fixture 的 decision_id、source metadata、manifest、snapshot 和 support matrix 关系
    depends_on: [maple-public-candidate-resolution, cclib-public-candidate-resolution, extxyz-public-variant-intake]
    status: done
    feature: 2026-06-03-parser-public-fixture-promotion-adapter
    minimal_loop: false
    notes: 已落地 Fixture Promotion Adapter summary/guards；当前 4 个 extxyz project-authored promoted decisions 全覆盖，source-gated fixture 必须带 decision_id 且匹配 source metadata/snapshot/support matrix，MAPLE/cclib blocked/reference-only decisions 不可执行

  - slug: public-fixture-import-preview-regression
    description: 把 promoted public/user-redacted fixtures 纳入 ImportRegistryWorkflow 与 Platform Shell import.preview 回归
    depends_on: [parser-public-fixture-promotion-adapter]
    status: done
    feature: 2026-06-03-public-fixture-import-preview-regression
    minimal_loop: false
    notes: 已落地 promotion-adapter-driven import preview regression；当前从 Fixture Promotion Adapter summary 派生 4 个 extxyz project-authored promoted fixtures，覆盖 Workflow/Shell preview projection、preview-only guard 和 MAPLE/cclib blocked/reference-only 反向 guard

  - slug: parser-public-fixture-guides
    description: 更新开发者/用户指南和 architecture，说明 public fixture intake gate、promotion/rejection、reference-only 和贡献真实样例流程
    depends_on: [public-fixture-import-preview-regression]
    status: done
    feature: 2026-06-03-parser-public-fixture-guides
    minimal_loop: false
    notes: 已落地 public fixture intake 指南收口；开发者指南串起 source inventory、fetch verify、decision ledger、promotion adapter、manifest/snapshot/support matrix、import preview regression 和 guide sync，用户指南明确 candidate/reference-only/blocked 不代表 supported，MAPLE/cclib originals 未 vendor，extxyz promoted coverage 是 project-authored variants
