roadmap: rxnflow-web-runtime-bridge
created: 2026-05-20

items:
  - slug: local-http-shell-bridge
    description: 新增本地 HTTP bridge server 和 CLI/dev 入口，GET /health 与 POST /api/shell 可调用真实 PlatformShellService 并保留 session
    depends_on: []
    status: done
    feature: 2026-05-20-local-http-shell-bridge
    minimal_loop: true
    notes: 已落地标准库本地 bridge，覆盖 fixture.run、workbench.snapshot、invalid JSON、unknown command、unknown path、method not allowed 和 bridge_internal_error；默认只监听 127.0.0.1

  - slug: web-http-shell-transport
    description: 新增前端 http-api ShellTransport、Vite env 选择和 runtime indicator，Web 可在 fixture/local-http 之间切换
    depends_on: [local-http-shell-bridge]
    status: done
    feature: 2026-05-20-web-http-shell-transport
    minimal_loop: false
    notes: 已落地 createHttpShellTransport、createConfiguredShellRuntime、runtime indicator 和 local-http browser smoke；默认仍为 fixture

  - slug: web-import-file-payload-bridge
    description: 扩展 import.preview 支持小文件 inline bytes preview，并让 Import Inbox 在 local-http 模式下可对真实文件做 preview
    depends_on: [web-http-shell-transport]
    status: done
    feature: 2026-05-20-web-import-file-payload-bridge
    minimal_loop: false
    notes: 已落地 path / inline_bytes source、payload_too_large / storage_object_missing 错误语义和 Web local-http inline file preview；不做 chunking、OPFS payload store、Worker pool 或 browser_storage adapter

  - slug: web-project-content-bridge
    description: 将 Project Sidebar 推进到真实 Project Content sections 与 bridge session 的打开/保存协作
    depends_on: [web-http-shell-transport]
    status: done
    feature: 2026-05-20-web-project-content-bridge
    minimal_loop: false
    notes: 已落地 Browser Project Content Files、project.open(content_files)、project.save_content(include_content_files=true)、显式 Open Bridge / Save Bridge Session 和桌面/窄屏 smoke；保持 ProjectSidebarState、WorkbenchDomainState 和 core session state 分离

  - slug: web-export-artifact-persistence
    description: 把 Web 导出的 runtime artifacts 写入 browser-local exports 路径，并显示 persisted state 与 artifact checksum
    depends_on: [web-project-content-bridge]
    status: done
    feature: 2026-05-20-web-export-artifact-persistence
    minimal_loop: false
    notes: 已落地 `exports/{basename}.{format}` browser-local object、`export-artifacts-v1` index upsert、Project Content index checksum 刷新、persisted path/checksum UI 和 desktop/narrow QA；不新增 CDX、PDF、PPTX、SVG 或 CSV 格式

  - slug: web-runtime-bridge-qa
    description: 补 bridge 模式的 Python contract、Web transport 和 Playwright smoke，覆盖 fixture/local-http 模式隔离
    depends_on: [web-import-file-payload-bridge, web-project-content-bridge, web-export-artifact-persistence]
    status: done
    feature: 2026-05-20-web-runtime-bridge-qa
    minimal_loop: false
    notes: 已落地独立 local-http Playwright config、bridge contract/http-api transport tests、真实 bridge browser smoke 和 fixture/local-http 模式隔离；local-http E2E 可用 RXNFLOW_E2E_PYTHON 指定 Python 解释器
