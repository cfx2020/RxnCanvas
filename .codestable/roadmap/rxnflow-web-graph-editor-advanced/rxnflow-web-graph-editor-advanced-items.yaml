roadmap: rxnflow-web-graph-editor-advanced
created: 2026-05-22

items:
  - slug: graph-editor-auto-layout
    description: 新增确定性 auto layout plan 和 Apply Layout 入口，将当前 graph nodes 整理到固定虚拟画布坐标，并可选 fit viewport
    depends_on: []
    status: done
    feature: 2026-05-22-graph-editor-auto-layout
    minimal_loop: true
    notes: 不新增 shell command，不改 Project Content schema，不做 edge rerouting；可见 position 更新必须来自 ShellResponse workspace projection

  - slug: graph-editor-path-delete
    description: 扩展 workspace.remove 支持 path_ids，让 selected path 可删除，并由 ShellResponse 修剪 active path 和 selection
    depends_on: []
    status: done
    feature: 2026-05-22-graph-editor-path-delete
    minimal_loop: false
    notes: 已落地 workspace.remove(path_ids) core/shell/fixture/Web 链路；删除 path 不删除 node 或 edge；删除 node 时仍由 core cascade 移除包含该 node 的 path

  - slug: graph-editor-edge-label-edit
    description: 新增 edge label draft 和 workspace edge update command，让 selected edge 可编辑 label
    depends_on: []
    status: done
    feature: 2026-05-22-graph-editor-edge-label-edit
    minimal_loop: false
    notes: 首轮只承诺 label 更新；空字符串 label 归一化为 null；不改变 from_node 或 to_node

  - slug: graph-editor-free-edge-drawing
    description: 新增从节点拖到节点的直接连线手势，保留 click-driven connect fallback
    depends_on: [graph-editor-edge-label-edit]
    status: done
    feature: 2026-05-22-graph-editor-free-edge-drawing
    minimal_loop: false
    notes: 已落地 Edge Connect Handle、pending preview line 和共享 workspace.connect 编排；不本地 append edge，不在创建时弹 label prompt

  - slug: graph-editor-multiselect-keyboard
    description: 支持多选、框选、Delete、Escape 和 selected node nudge，并复用 Workspace Selection 数组协议
    depends_on: [graph-editor-path-delete]
    status: done
    feature: 2026-05-22-graph-editor-multiselect-keyboard
    minimal_loop: false
    notes: 已落地 Shift-click add/toggle、select mode rubber-band node selection、Delete/Backspace/Escape 和方向键 selected node nudge；selection authority 仍是 Workspace Selection projection，nudge 复用 workspace.move_node

  - slug: graph-editor-wheel-minimap
    description: 补 wheel/pinch zoom 和 minimap navigation，继续通过 workspace.set_viewport 更新 viewport
    depends_on: [graph-editor-auto-layout]
    status: done
    feature: 2026-05-22-graph-editor-wheel-minimap
    minimal_loop: false
    notes: 已落地 graph surface wheel zoom、ctrl/meta wheel pinch-like zoom、Graph Minimap node dots/window、click navigation 和 drag draft；只通过 workspace.set_viewport 生效，不另存 graph layout state

  - slug: graph-editor-lightweight-history
    description: 为 layout、viewport、selection 和 nudge 提供 bounded runtime undo/redo，不持久化、不覆盖 destructive delete
    depends_on: [graph-editor-auto-layout, graph-editor-multiselect-keyboard, graph-editor-wheel-minimap]
    status: done
    feature: 2026-05-24-graph-editor-lightweight-history
    minimal_loop: false
    notes: 已落地 Graph Editor History runtime-only stack、Undo/Redo controls 和 graph scoped shortcuts；只覆盖 layout、viewport、selection、selected node nudge，replay 复用既有 workspace commands，不写 Project Content、Browser Project Repository、ShellResponse 或 localStorage

  - slug: graph-editor-advanced-e2e-qa
    description: 补高级图谱编辑桌面/窄屏 E2E、local-http shell contract smoke 和用户/开发者说明
    depends_on: [graph-editor-free-edge-drawing, graph-editor-lightweight-history]
    status: done
    feature: 2026-05-24-graph-editor-advanced-e2e-qa
    minimal_loop: false
    notes: 已落地 fixture desktop advanced graph matrix、narrow advanced controls、local-http bridge smoke 边界和开发者 QA 指南；local-http 不复制复杂 graph gestures
