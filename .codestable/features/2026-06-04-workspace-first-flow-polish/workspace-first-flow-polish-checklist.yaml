steps:
  - action: "Flow Shell Skeleton：重构 WorkbenchShell 的语义布局，建立 Project Rail / Canvas Stage / Analysis Dock 容器和 UI-only state"
    exit_signal: "现有 fixture run / open project / graph canvas / energy / export 功能仍可通过 component tests 访问"
    status: done

  - action: "Project Rail Compaction：收束 ProjectSidebar 信息层级，让 active project + Project Files + save/bundle actions 成为主要内容"
    exit_signal: "active project raw/export files 可见且可拖；project create/open/save/bundle 仍可达；snapshot/metrics 不再干扰主流程"
    status: done

  - action: "Canvas Stage Source Tray：把 Import Inbox 降级为画布上下文入口和 detailed preview，不再长期占据画布上方大块空间"
    exit_signal: "外部 file drop、project raw file drop、多候选 chooser 和 raw persistence 状态仍通过测试；空画布有明确 drop affordance"
    status: done

  - action: "Analysis Dock Tabs：把 PES、Export、Object、Diagnostics 收束为右侧 tabs，并根据状态给 badge/status"
    exit_signal: "active path/profile 默认可看到 PES；Export 下载/persistence 仍可用；Object detail 和 command diagnostics 可达"
    status: done

  - action: "Visual Density / Responsive Pass：整理 CSS palette、spacing、cards、button/icon controls、desktop/narrow constraints"
    exit_signal: "桌面和 390px 窄屏无整体水平溢出，画布/表格/按钮文字不重叠，页面不再呈现多层 nested cards"
    status: done

  - action: "Verification / Scope Guard：更新 tests、跑 Web build/test/E2E smoke、Python unittest 和范围 grep"
    exit_signal: "Web targeted tests/build、必要 Playwright desktop/narrow smoke 通过；未新增 shell/core/persistence schema 或第三方 UI/chart dependency"
    status: done

