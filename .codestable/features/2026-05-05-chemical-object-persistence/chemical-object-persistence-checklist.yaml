feature: 2026-05-05-chemical-object-persistence
created: 2026-05-05

steps:
  - action: "模型与 registry 元数据：给 Registered ChemicalObject 增加 registry_fingerprint，并在 register 时写入"
    exit_signal: "新登记对象可观察到非空 registry_fingerprint；现有 fixture 构造保持兼容"
    status: done

  - action: "Registry snapshot/restore API：新增 list_objects 和 restore_objects，重建 objects map 与 fingerprint index"
    exit_signal: "保存前 registry 中对象可列出；新 registry restore 后 get_object 成功，重复 restore 幂等"
    status: done

  - action: "ChemicalObject section codec：实现带 validation 的 chemical-objects-v1 serialize/deserialize"
    exit_signal: "对象、geometry、energies、thermochemistry、provenance、corrections、registry_fingerprint 往返一致"
    status: done

  - action: "ProjectContentStore 接入：将 chemical_objects section 改用长期 codec，并保持 project-content-v1 index 行为不变"
    exit_signal: "save_snapshot/load_snapshot 保留 registry_fingerprint 和 corrections，section checksum 重复保存稳定"
    status: done

  - action: "错误与范围守护：覆盖坏 schema、裸 energy、unsupported unit、重复 object/fingerprint/correction、project id mismatch，以及不碰 parser/import/graph/energy/export 的边界"
    exit_signal: "新增 persistence tests 和现有全量 unittest 通过"
    status: done

