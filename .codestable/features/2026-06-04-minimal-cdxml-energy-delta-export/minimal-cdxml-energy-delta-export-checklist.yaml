feature: 2026-06-04-minimal-cdxml-energy-delta-export
created: 2026-06-04

steps:
  - action: "Route Annotation Contract：扩展 EnergyDiagramState / CdxmlDiagramOptions，让 route 派生 step delta、correction count、missing count"
    exit_signal: "unit tests 证明 delta 只在相邻有效 points 间出现，missing adjacency 不产生 delta，correction count 来自 expression"
    status: done

  - action: "CDXML Writer Text Markers：增强 _render_cdxml，输出 structure name、relative value + unit、dE label、corr xN 和 missing reason"
    exit_signal: "解析 CDXML XML 后能在 text nodes 中找到预期 labels，missing point 不生成 state line / connector"
    status: done

  - action: "Shell/Web Export Boundary：Platform Shell 透传 export options；Web 保持只调用 export.profile、下载和 persistence 现有路径"
    exit_signal: "shell tests 覆盖 enhanced CDXML bytes/metadata；Web tests 证明无需前端 writer，CDXML artifact 仍显示和持久化"
    status: done

  - action: "Documentation / Scope Guard：更新 architecture / docs 中 CDXML/CDX 边界和最小 CDXML 口径"
    exit_signal: "文档说明 CDXML 包含 name/relative/delta/missing/correction，CDX 仍 unsupported"
    status: done

  - action: "Verification：运行 Python tests、Web targeted tests/build、YAML、diff check 和必要浏览器 smoke"
    exit_signal: "验证通过；未新增 CDX、molecule-level CDXML、Web XML writer 或持久化 schema"
    status: done

