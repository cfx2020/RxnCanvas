feature: 2026-05-20-web-http-shell-transport
created: 2026-05-20

steps:
  - action: "Transport type and implementation：扩展 ShellTransportKind，新增 createHttpShellTransport"
    exit_signal: "Vitest 可 mock fetch 验证 success / network failure / HTTP error / invalid JSON"
    status: done

  - action: "Runtime factory：新增 createConfiguredShellRuntime(import.meta.env)，默认 fixture，local-http 读取 endpoint"
    exit_signal: "单测确认默认 fixture 和 local-http config"
    status: done

  - action: "UI indicator：WorkbenchShell 顶栏显示 runtime mode 和 endpoint"
    exit_signal: "Testing Library 能看到 Runtime Fixture / Runtime Local HTTP"
    status: done

  - action: "Verification：跑 Web test/build、Python tests，并用浏览器验证默认 fixture 页面和 local-http bridge flow"
    exit_signal: "桌面/窄屏无 console error、无水平溢出；local-http 模式可通过 bridge 执行 fixture.run"
    status: done

  - action: "Acceptance 回写：更新 architecture、requirement、roadmap 和验收报告"
    exit_signal: "checklist 全 passed，roadmap item done"
    status: done

checks:
