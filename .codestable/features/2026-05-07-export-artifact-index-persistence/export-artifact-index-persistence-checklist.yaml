feature: 2026-05-07-export-artifact-index-persistence
created: 2026-05-07

steps:
  - action: "ExportArtifactRecord 名词骨架：落地长期 artifact index record，并收紧 ProjectContentSnapshot.export_artifacts"
    exit_signal: "可构造 record；ProjectContentSnapshot.export_artifacts 类型语义明确，非空 export artifacts 不再被默认拒绝"
    status: done

  - action: "Export artifact index codec 骨架：实现 export-artifacts-v1 section 的 schema/project/records 往返"
    exit_signal: "空 index 和单条 record 往返一致；坏 schema 或 project id mismatch 返回 Result error"
    status: done

  - action: "Path/checksum/metadata 严格校验：校验 format、exports/ path、checksum、metadata JSON-safe 和重复 id/path"
    exit_signal: "非法 path、absolute path、unsupported format、bad checksum、metadata shape 和重复 id/path 返回 invalid_input"
    status: done

  - action: "ProjectContentStore 接入：增加 export_artifacts section path，保存/加载 snapshot.export_artifacts，并保持 index/checksum 行为稳定"
    exit_signal: "ProjectContentStore.save_snapshot/load_snapshot 可恢复 export artifact records，且 chemical/import/graph/workspace/energy sections 不回退"
    status: done

  - action: "错误与范围守护：覆盖不保存 bytes、不碰 manifest/resource、不调用 export writer/parser/import/registry/graph/energy/platform 的边界"
    exit_signal: "新增 export artifact index tests 和现有全量 unittest 均通过"
    status: done

