feature: 2026-05-20-web-workbench-e2e-qa
created: 2026-05-20

steps:
  - action: "E2E Project Setup：新增 Playwright config、npm run test:e2e 和 ignored output paths"
    exit_signal: "npm run test:e2e -- --list 能列出 tests，dev server 使用 http://127.0.0.1:5173/"
    status: done

  - action: "E2E Helpers：新增清理 storage、console capture、layout overflow、region visibility 和 screenshot helper"
    exit_signal: "helper 能在 workbench 页面返回稳定断言，不依赖临时 /tmp 脚本"
    status: done

  - action: "Desktop Workbench Journey：覆盖 project create/save、Fixture Run、import preview/register、object selection、graph add/connect/set path、energy compute、report export"
    exit_signal: "Chromium 1280x720 下 journey 通过，关键文本/状态和 no-overflow 断言成立"
    status: done

  - action: "Narrow Layout Journey：覆盖 390x840 下 fixture -> graph/energy/export smoke 和关键区域布局健康"
    exit_signal: "窄屏测试通过，graph surface、energy table/curve、artifact list 和 warnings 无水平溢出"
    status: done

  - action: "Verification And Docs：运行 E2E、Web test/build、Python 单测，回写 architecture/requirement/roadmap 验收文档"
    exit_signal: "npm run test:e2e、npm run test、npm run build、python3 -m unittest discover 通过；CodeStable 文档完成"
    status: done

