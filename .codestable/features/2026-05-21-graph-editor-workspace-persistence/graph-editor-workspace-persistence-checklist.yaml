feature: 2026-05-21-graph-editor-workspace-persistence
created: 2026-05-21

steps:
  - action: "Design And Roadmap Gate：落盘 design/checklist，回写 roadmap item 为 in-progress"
    exit_signal: "design status approved；checklist YAML 和 roadmap items YAML 校验通过"
    status: done

  - action: "Shell Selection Contract：在 core Platform Shell 和 Web DTO/fixture 增加 workspace.select 与 WorkspaceSummary.selection"
    exit_signal: "Python / ShellClient tests 覆盖选择、空选择、缺失引用和 JSON-safe projection"
    status: done

  - action: "Web Selection Sync：WorkbenchShell 把 node/edge/path 选择提交到 shell，并从 workspace projection 恢复 GraphEditorInteractionState"
    exit_signal: "component tests 覆盖 node/edge/path selection command、Open Bridge 后 restored selection 可见，connect/path draft 不回退"
    status: done

  - action: "Fixture Content Restore：fixture save/open content files 序列化并恢复当前 graph/workspace 状态"
    exit_signal: "Web tests 证明 Save Bridge 后的 content files 包含 node position、viewport、selection、active path，重新 Open Bridge 后状态恢复"
    status: done

  - action: "Verification And Scope Guard：跑 Web tests/build、Python 单测和浏览器主链路"
    exit_signal: "测试通过；Browser/Playwright 验证页面非空白、console clean、保存/恢复有可观察结果；scope grep 未新增自动保存、localStorage graph state 或云同步"
    status: done

