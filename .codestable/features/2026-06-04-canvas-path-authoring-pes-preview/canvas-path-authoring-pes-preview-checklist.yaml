feature: 2026-06-04-canvas-path-authoring-pes-preview
created: 2026-06-04

steps:
  - action: "Path Auto-Extend Helper：实现纯函数 path auto-extend 判断，覆盖 create、append-tail、prepend-head、branch/internal/cycle/stale/no-change"
    exit_signal: "unit tests 证明只有无歧义 head/tail 连接会返回 set-path，其他都返回 manual"
    status: done

  - action: "Connect To Active Path Orchestration：WorkbenchShell 在 workspace.connect 成功后串联 optional workspace.set_path，GraphCanvas 显示 manual/auto status"
    exit_signal: "component tests 覆盖拖线/Connect 后创建 path、延长 path、分叉不改 path，且可见状态来自 response"
    status: done

  - action: "PES Compute Intent：active path 或能量选项变化后按 signature 自动触发 energy.compute，保留手动 Compute fallback"
    exit_signal: "测试证明 path 变化触发一次 compute，签名不变不重复触发；compute error 可见"
    status: done

  - action: "PES Preview Step Delta Projection：EnergyProfilePanel 派生 PesPreviewPointSummary，新增 step delta table/detail/summary"
    exit_signal: "有效相邻点显示 delta；任一 missing 点 delta 为空且 missing reason 可见；correction count 来自 expression"
    status: done

  - action: "I18n / Responsive / Accessibility：补双语文案、状态 marker、窄屏表格/曲线布局和 keyboard/focus 细节"
    exit_signal: "桌面和 390px 窄屏无水平溢出；PES point/table row 可键盘选择"
    status: done

  - action: "Verification And Scope Guard：跑 Web tests/build、Python unittest、浏览器 smoke 和范围 grep"
    exit_signal: "验证通过；未新增 CDXML/CDX writer、core energy algorithm、持久层 schema 或前端 parser/energy 重算逻辑"
    status: done

