feature: 2026-06-18-multi-canvas-persistence
created: 2026-06-18

steps:
  - action: "微重构：把 App.tsx 内 active canvas <-> workspace snapshot 的纯 helper 拆到独立状态模块，先保持现有 runtime 多画布行为不变"
    exit_signal: "App 仍可创建/切换运行时画布，且纯 helper 不再散落在容器 JSX 里"
    status: done

  - action: "Project schema 与 clone helper 升级：把 ProjectWorkspaceSnapshot 与 project package types 改成多画布结构，并提供 v1 单画布 normalize helper"
    exit_signal: "单元测试证明 v1 输入会归一化成默认 canvas，v2 输入可 round-trip"
    status: done

  - action: "App active-canvas projection 收口：当前 active canvas 与 React 编辑态双向同步，切换/新建画布会更新 project workspace snapshot"
    exit_signal: "组件测试证明不同画布内容互不覆盖，current snapshot 含全部 canvases + activeCanvasId"
    status: done

  - action: "Open / autosave / export 路径接通：serialize/restore、desktop autosave、startup restore、Export project 统一使用 v2 多画布 schema"
    exit_signal: "保存后重开项目/重启 app 时，多画布集合和 active canvas 一致恢复"
    status: done

  - action: "旧项目兼容与坏引用修正：过滤坏 selection、空 canvases、缺失 activeCanvasId，并让旧单画布项目自动迁移"
    exit_signal: "旧项目可直接打开且不白屏、不丢主图，坏引用被安全回退"
    status: done

  - action: "验证与范围守护：跑 web tests/build、desktop smoke/runtime smoke，并完成浏览器/桌面实际 smoke"
    exit_signal: "验证通过，且未扩展到 path tabs、云同步、history persistence 或跨画布高级编辑"
    status: done

