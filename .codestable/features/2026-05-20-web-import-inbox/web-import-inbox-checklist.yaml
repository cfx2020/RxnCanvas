feature: 2026-05-20-web-import-inbox
created: 2026-05-20

steps:
  - action: "Import Projection Types And Fixture Commands：补 import item/preview/register DTO，fixture transport 支持 import.preview / import.register_all"
    exit_signal: "ShellClient tests 可得到 JSON-safe preview batch、failed item、warning 和 repeated register ids"
    status: done

  - action: "Import Inbox State And UI：新增 Import Inbox 组件和本地 state，支持 file selection metadata、format/strict、preview/register/clear"
    exit_signal: "component test 能选择两个文件并看到 queued list、按钮状态和 preview batch"
    status: done

  - action: "Workbench Integration：WorkbenchShell 挂载 Import Inbox，preview/register 更新 WorkbenchDomainState imports/objects/counts"
    exit_signal: "preview 后 counts.imports 更新，register 后 objects/counts.objects 更新，fixture graph/workbench 仍可运行"
    status: done

  - action: "I18n And Error/Warning Rendering：新增双语文案，item warning/error/code/target/raw resource metadata 原样展示"
    exit_signal: "英文/中文测试均能查询 Import Inbox 主文案，warning/error code 可见"
    status: done

  - action: "Verification And Scope Guard：跑 Web test/build、Python 单测、真实浏览器桌面/窄屏验证，无 prohibited bridge/cloud/parser scope"
    exit_signal: "npm run test、npm run build、python3 -m unittest discover 通过；browser 无重叠；scope grep 通过"
    status: done

