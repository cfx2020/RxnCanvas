checks:
  - item: "1280x720 fixture E2E 触发 Apply Layout 后，可见节点位置 / viewport projection 发生预期变化，且没有 console issue"
    source: 验收场景
    status: passed

  - item: "1280x720 fixture E2E 可选中并删除 path，删除后 path list / active path / network preview 跟随 workspace projection"
    source: 验收场景
    status: passed

  - item: "1280x720 fixture E2E 可选中 edge、编辑 label、应用后 SVG/edge hitbox/selected detail 显示新 label"
    source: 验收场景
    status: passed

  - item: "1280x720 fixture E2E 可从节点 Edge Connect Handle 拖到另一个节点创建 edge，且 disconnected diagnostics 更新"
    source: 验收场景
    status: passed

  - item: "1280x720 fixture E2E 可通过 Shift-click 或 rubber-band 形成多选，并用 Delete 删除当前选择"
    source: 验收场景
    status: passed

  - item: "1280x720 fixture E2E 可用方向键 nudge selected nodes，并可 Undo / Redo 恢复移动"
    source: 验收场景
    status: passed

  - item: "1280x720 fixture E2E 覆盖 wheel zoom、minimap click/drag、Undo/Redo controls，验证 viewport projection 变化"
    source: 验收场景
    status: passed

  - item: "Save Bridge Session 后 reload + Open Bridge 可恢复 node position、edge label、viewport、selected node/edge/path 或 active path；Graph Editor History 不要求恢复"
    source: 验收场景
    status: passed

  - item: "390x840 fixture E2E 可看到并操作 graph advanced controls，Network Preview、Path list、Edge Label Editor、Minimap 和 Undo/Redo controls 不重叠、不造成水平溢出"
    source: 验收场景
    status: passed

  - item: "默认 fixture E2E 检查 framework overlay absent、console clean、no horizontal overflow"
    source: 验收场景
    status: passed

  - item: "local-http E2E 仍只覆盖 Python bridge 主链路，不加入复杂 graph gesture matrix"
    source: 范围守护
    status: passed

  - item: "Playwright output 只写入 gitignored web/test-results*/ / web/playwright-report*/"
    source: 范围守护
    status: passed

  - item: "QA helper 不直接 mutate React state、Browser Project Repository bytes、Project Content files 或 ShellResponse"
    source: 范围守护
    status: passed

  - item: "不新增生产 dependency、shell command、Project Content schema、Browser Project Repository API 或 localStorage graph persistence"
    source: 范围守护
    status: passed

  - item: "不因为 E2E 需要而给 UI 加测试专用生产按钮"
    source: 反向核对
    status: passed

  - item: "不把 local-http smoke 变成又慢又脆的完整交互套件"
    source: 反向核对
    status: passed

  - item: "不提交 Playwright 产物"
    source: 反向核对
    status: passed

  - item: "不把 graph history、hover、pending edge、rubber-band draft、minimap draft 写入持久化"
    source: 反向核对
    status: passed

  - item: "不把 CDXML / ChemDraw 导出能力混进本 QA feature"
    source: 反向核对
    status: passed
