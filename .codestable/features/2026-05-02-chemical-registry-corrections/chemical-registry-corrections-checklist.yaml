feature: 2026-05-02-chemical-registry-corrections
created: 2026-05-02

steps:
  - action: "Registry 服务骨架：定义 project-scoped registry 入口和对象存储边界"
    exit_signal: "可以创建 registry，登记一个 ParseResult 后通过 object id 取回对象"
    status: done

  - action: "ParseResult 登记节点：把 drafts 固化为 ChemicalObject，复制 provenance/source_file_id 并生成稳定 id"
    exit_signal: "parser result 中多个 draft 可按顺序登记为多个对象"
    status: done

  - action: "基础去重节点：实现 draft fingerprint 和重复 register 幂等返回"
    exit_signal: "同一 project 重复 register 不增加对象；不同 project 互不影响"
    status: done

  - action: "Correction 节点：实现 correction 追加、同 id 幂等和冲突检测"
    exit_signal: "新增 correction 被 append；同 id 不同 payload 返回 invalid_input"
    status: done

  - action: "边界守护与测试覆盖：覆盖错误路径、fixture 兼容和跨模块边界"
    exit_signal: "registry tests、parser tests、core fixture tests 全部通过；registry 不调用 parser/project/graph/energy"
    status: done

