  - item: "summary 中 promoted file ids 为空"
    source: 验收场景
    status: passed

  - item: "每个 MAPLE candidate 当前都是 needs-permission/blocked，并带至少一个 fallback fixture"
    source: 验收场景
    status: passed

  - item: "每个 MAPLE candidate fallback fixture 存在于 manifest，且 source.kind 为 synthetic"
    source: 验收场景
    status: passed

