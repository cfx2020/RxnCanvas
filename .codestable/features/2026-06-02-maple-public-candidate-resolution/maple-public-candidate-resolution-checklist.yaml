feature: 2026-06-02-maple-public-candidate-resolution
created: 2026-06-02

steps:
  - action: "Resolution summary contract：定义 MAPLE resolution summary dataclass/helper，从 inventory + decision ledger + support matrix 派生当前状态"
    exit_signal: "summary 覆盖 maple-dev-example 全部 source file ids，并正确分类 3 个 candidate 与 14 个 reference-only files"
    status: done

  - action: "MAPLE resolution guards：补 focused tests，证明 candidates blocked with fallback、reference-only self anchors、promoted originals empty"
    exit_signal: "缺 decision、candidate fallback 缺失、reference-only anchor 缺失或非 MAPLE source 会被拒绝/暴露"
    status: done

  - action: "Support matrix and docs guard：补 support matrix consistency tests 和 developer guide"
    exit_signal: "MAPLE public originals 未进入 executable fixture ids；docs 明确当前无 promoted MAPLE originals、path/frequency/MD/scan 仍 reference-only；focused tests 和 git diff --check 通过"
    status: done

checks:
