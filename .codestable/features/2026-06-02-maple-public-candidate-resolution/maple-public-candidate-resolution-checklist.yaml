    source: 验收场景
    status: passed

  - item: "summary 覆盖 maple-dev-example 的全部 17 个 source file ids，无 missing/extra/unresolved"
    source: 验收场景
    status: passed

  - item: "summary 中 candidate file ids 精确为 maple-sp-output-example、maple-opt-output-example、maple-opt-final-xyz-example"
