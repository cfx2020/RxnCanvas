    exit_signal: "组件或浏览器测试证明 fetch failure 显示 transport_unavailable / http-api"
    status: done

  - action: "Docs and workflow closure：更新 architecture、requirement、roadmap/checklist，并跑完整验证命令"
    exit_signal: "Python unittest、Web Vitest、build、fixture E2E、local-http E2E、YAML validation 与浏览器验证通过或记录明确 fallback 原因"
    status: done

