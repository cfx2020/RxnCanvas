    exit_signal: "macOS Option / Windows Ctrl 复制拖动节点；普通 Ctrl/Cmd 快捷键不被误当作拖动复制"
    status: done
  - action: "UI 验证与范围守护：跑测试/build，并用浏览器验证桌面/窄屏手势"
    exit_signal: "画布快捷键和拖动路径可用，console clean；scope grep 未出现系统剪贴板/globalShortcut/schema/engine 改动"
    status: done

