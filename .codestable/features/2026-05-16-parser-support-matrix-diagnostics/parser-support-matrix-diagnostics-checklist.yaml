feature: 2026-05-16-parser-support-matrix-diagnostics
created: 2026-05-16

steps:
  - action: "Matrix file：新增 support-matrix.yaml，覆盖当前 9 个 manifest fixture ids 和 MAPLE reference-only artifacts"
    exit_signal: "YAML 可读且字段边界完整"
    status: done

  - action: "Loader validation：新增 support matrix loader 和结构校验"
    exit_signal: "bad schema、unknown fixture id、undefined diagnostic code 可被测试捕获"
    status: done

  - action: "Corpus consistency tests：新增 tests 覆盖 fixture ids、snapshot codes 和 partial known limits"
    exit_signal: "focused tests 通过"
    status: done

  - action: "Scope guards：确认未改 runtime parser 行为、未新增真实 fixture 或产品入口"
    exit_signal: "全量 unittest 和 YAML 校验通过"
    status: done

checks:
  - item: "tests/fixtures/parsers/support-matrix.yaml 存在，schema_version 为 parser-support-matrix-v1"
    source: "验收场景"
    status: passed

  - item: "Support matrix entries 覆盖当前 manifest 里的全部 9 个 fixture ids"
    source: "验收场景"
    status: passed

  - item: "每个 supported / partial entry 至少引用一个 fixture id，reference-only entry 不要求 fixture id"
    source: "验收场景"
    status: passed

  - item: "每个 partial entry 有非空 known_limits"
    source: "验收场景"
    status: passed

  - item: "Diagnostic catalog 定义 roadmap 中列出的 warning codes 和 error codes"
    source: "验收场景"
    status: passed

  - item: "每个 snapshot 里的 warning/error code 都能在 diagnostic catalog 中找到"
    source: "验收场景"
    status: passed

  - item: "MAPLE .sum、AutoNEB tree JSON、MD thermo .dat 以 reference-only entry 记录，不进入 manifest executable fixtures"
    source: "验收场景"
    status: passed

  - item: "support matrix loader 拒绝未知 schema_version"
    source: "边界场景"
    status: passed

  - item: "support matrix loader 拒绝 unknown fixture id"
    source: "边界场景"
    status: passed

  - item: "support matrix loader 拒绝 observed code 未定义"
    source: "边界场景"
    status: passed

  - item: "本 feature 不修改 runtime parser modules"
    source: "范围守护"
    status: passed

  - item: "本 feature 不新增真实 third-party fixture 或下载流程"
    source: "范围守护"
    status: passed

  - item: "本 feature 不新增产品 UI、CLI、Web route 或 import hint API"
    source: "范围守护"
    status: passed

  - item: "本 feature 不调用 ProjectStore、ImportRegistryWorkflow、ChemicalRegistry、ReactionGraphService、EnergyProfileEngine、ReportExportService、PlatformShellService 或 ProjectBundleService"
    source: "范围守护"
    status: passed
