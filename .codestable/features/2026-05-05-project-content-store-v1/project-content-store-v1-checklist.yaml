steps:
  - action: "名词骨架：落地 ProjectContentIndex、ProjectContentFile、StorageObject、WriteReceipt、ProjectContentSnapshot 和 backend/store 协议"
    exit_signal: "可构造对象；空 project_ref / unsafe path 返回 structured error"
    status: done

  - action: "本地 backend：实现 read/write/exists/list/delete 和安全 path 解析"
    exit_signal: "能写入 .rxnflow/state/*.json，checksum 和 byte_size 可验证"
    status: done

  - action: "Snapshot JSON 序列化：实现 fixture 所需 ChemicalObject、ReactionGraph、WorkspaceSnapshot、EnergyProfile 的 deterministic JSON 往返"
    exit_signal: "对象、图谱和 profile 的关键 id/能量/path 字段往返一致"
    status: done

  - action: "Content store 编排：实现 save_snapshot/load_snapshot/load_index，section 先写、index 后写"
    exit_signal: "新 store 实例可从项目目录恢复 fixture snapshot"
    status: done

  - action: "错误和边界：补 index 缺失、坏 JSON、schema 不兼容、unsafe path、缺失 section 的错误路径"
    exit_signal: "关键错误均返回 Result error，不静默 fallback"
    status: done

  - action: "测试与范围守护：覆盖最小闭环、幂等 checksum、路径安全和不触碰现有核心服务语义"
    exit_signal: "新增 persistence tests 和现有全量 unittest 均通过"
    status: done

