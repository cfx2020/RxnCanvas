feature: 2026-06-03-canvas-chemical-node-card
created: 2026-06-03

steps:
  - action: "Shell Candidate Projection：扩展 import.preview candidate summary / ObjectSummary coordinate preview，并新增 import.register_selection"
    exit_signal: "Python shell tests 与 Web shell tests 能看到 candidates、coordinatePreview，并能按 object_indices 登记"
    status: done

  - action: "Candidate Chooser State：把 raw drop 多对象路径从 error 改为 chooser pending state"
    exit_signal: "多候选 preview 不创建 node，GraphCanvas 显示 chooser，取消和错误路径可见"
    status: done

  - action: "Selection Register And Node Creation：确认候选后 register selection 并按落点创建一个或多个 graph nodes"
    exit_signal: "单选创建一个 node，多选创建 stack nodes；失败不伪造 node"
    status: done

  - action: "Canvas Chemical Node Summary：派生并渲染结构名称、方法、电荷自旋、能量、atom count、warnings"
    exit_signal: "fixture/imported node card 信息更完整；组合节点仍可读"
    status: done

  - action: "UX / I18n / Responsive：补候选选择器和节点卡片文案、样式、窄屏布局"
    exit_signal: "zh-CN/en-US 文案完整；桌面和 390px 窄屏 chooser/node card 无重叠、无水平溢出"
    status: done

  - action: "Verification And Scope Guard：跑 Python/Web tests/build/browser smoke，确认无 parser runtime、energy、CDXML、cloud 越界"
    exit_signal: "测试通过；scope grep 无违规依赖；browser smoke 覆盖多候选选择与节点卡片"
    status: done

