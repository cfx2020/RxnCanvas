feature: 2026-05-02-parser-plugin-baseline
created: 2026-05-02

steps:
  - action: "Parser contract 骨架：落地 RawFile、ParserFormat、ParserCapability、ParseOptions、ParseResult、ParserPlugin，并保持 Result warnings 协议"
    exit_signal: "可以用 fake plugin round-trip 一个 ParseResult"
    status: done

  - action: "Parser Registry 编排：实现插件注册、capability 排序、unsupported/ambiguous 分支"
    exit_signal: "无候选、单候选、多候选冲突都有可观察 Result"
    status: done

  - action: "XYZ / extxyz plugin：实现标准 XYZ geometry 解析，并通过 ASE 支持 extxyz metadata"
    exit_signal: "标准 XYZ 输出 geometry；extxyz 可读取能量/cell/pbc 等可用 metadata，坐标单位为 angstrom"
    status: done

  - action: "cclib Gaussian/ORCA adapter：安装/声明 cclib，隔离 backend wrapper，并映射基础字段"
    exit_signal: "Gaussian/ORCA fixture 各输出至少一个 ChemicalObjectDraft，包含 provenance 和显式能量单位"
    status: done

  - action: "MAPLE plugin：解析 MAPLE .out 基础字段和 MAPLE 多帧 .xyz 的 frame/image energy 注释"
    exit_signal: "MAPLE sp .out 和 MAPLE MEP/trajectory .xyz fixture 均输出 ChemicalObjectDraft"
    status: done

  - action: "错误路径与范围守护：补齐 unsupported format、file missing、parse failed、partial parse warning，以及不写 Project Store/Registry 的反向测试"
    exit_signal: "parser 测试和既有 Project Store / fixture 测试全部通过"
    status: done

