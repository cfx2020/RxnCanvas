feature: 2026-05-16-web-app-shell-client
created: 2026-05-16

steps:
  - action: "前端工程骨架：创建 web/ package、Vite/TypeScript/React 基础配置和 npm scripts"
    exit_signal: "npm install 后 npm run build 能产出静态 build"
    status: done

  - action: "Shell DTO 与 Fixture Transport：落地 TypeScript shell contracts、ShellClient、fixture response 和 unknown command 错误路径"
    exit_signal: "前端单测覆盖 fixture.run 成功、未知 command invalid_input 和 JSON-safe payload"
    status: done

  - action: "Workbench Shell Layout：实现第一屏工作台布局、local-only indicator、command status、summary panel 和后续面板占位"
    exit_signal: "浏览器打开后直接看到可操作工作台，点击 fixture command 会更新 UI state"
    status: done

  - action: "前端测试与范围守护：补 component/unit tests，确认没有 Python core 复制、没有 cloud/auth/http/server dependencies"
    exit_signal: "前端 test/build 通过，scope grep 无方案外依赖"
    status: done

  - action: "浏览器验证：启动本地 dev server，用浏览器检查桌面和窄屏布局"
    exit_signal: "桌面/窄屏无文本和控件重叠，第一屏不是 landing/hero"
    status: done

  - action: "收口：校验 CodeStable YAML、Python 单元测试和 git diff 范围，准备 acceptance 回写 architecture / requirement / roadmap"
    exit_signal: "实现证据足以支撑验收报告"
    status: done

