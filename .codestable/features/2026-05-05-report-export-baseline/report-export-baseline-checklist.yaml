feature: 2026-05-05-report-export-baseline
created: 2026-05-05

steps:
  - action: "导出名词骨架：落地 ExportFormat、ExportArtifact、ExportRequest、EnergyTableRow 和 service 空壳"
    exit_signal: "可构造 request，空 formats / 缺 project id 返回 invalid_input"
    status: done

  - action: "Service 编排与 artifact sink：实现格式分派、artifact id、bytes-only 返回和 destination_dir 写盘"
    exit_signal: "伪 writer 可返回 bytes artifact，写盘路径安全校验生效"
    status: done

  - action: "Energy table 派生：从 ChemicalObject、EnergyProfile 和可选 table_rows 生成 structure-first 行式数据和 warnings 数据"
    exit_signal: "第一列为结构名称；Egas/Ggas/Esol/Gsol 等缺失字段留空而不是编造；missing point 保留 missing_reason"
    status: done

  - action: "XLSX workbook writer：输出 Energy Table sheet、optional Energy Profile sheet 和 optional Warnings sheet"
    exit_signal: "生成 .xlsx zip，可读到 Energy Table worksheet、结构名称、能量列和 warnings 内容"
    status: done

  - action: "Energy diagram route 派生：从 EnergyProfile 生成 PNG/CDXML 共享的 state path"
    exit_signal: "有效 points 保留 label/relative energy；missing points 保留断点和 warning"
    status: done

  - action: "PNG energy plot writer：输出 EnergyProfile 静态曲线 PNG"
    exit_signal: "PNG header、尺寸、非空像素和 missing point 标记可验证"
    status: done

  - action: "CDXML energy diagram writer：输出 state-line / connector / label / axis 级 CDXML"
    exit_signal: "XML well-formed，包含 CDXML/page/colortable/fonttable、state labels、relative energy text、connectors 和 y-axis metadata"
    status: done

  - action: "范围守护与回归测试：覆盖不触碰 parser/import/registry/graph patch/energy compute/UI，并保留现有 92 个测试"
    exit_signal: "export tests、fixture/graph/workspace/energy/import/parser 回归全部通过"
    status: done

checks:
  - item: "ExportFormat 存在且只支持 png、cdxml、xlsx"
    source: 名词契约
    status: passed

  - item: "ExportArtifact 包含 id、format、path、bytes、created_at 和 metadata"
    source: 名词契约
    status: passed

  - item: "ExportRequest 包含 formats、graph、profile、objects、table_rows、destination_dir、basename、title 和 options"
    source: 名词契约
    status: passed

  - item: "EnergyTableColumn 和 EnergyTableRow 存在，EnergyTableRow 第一列语义为 structure_name"
    source: 名词契约
    status: passed

  - item: "EnergyDiagramState、EnergyDiagramRoute 和 CdxmlDiagramOptions 存在"
    source: 名词契约
    status: passed

  - item: "ReportExportService 公开 export(project_id, request) -> Result[tuple[ExportArtifact, ...]] 入口"
    source: 名词契约
    status: passed

  - item: "export workflow 按 validate -> resolve basename/output mode -> dispatch writer -> build artifact -> optional write file -> return artifacts 编排"
    source: 编排骨架
    status: passed

  - item: "一个 request 内 formats 按传入顺序处理，返回 artifact 顺序与 request.formats 一致"
    source: 编排骨架
    status: passed

  - item: "任一 writer 失败时整个 request 返回 error，不返回半成功 Result"
