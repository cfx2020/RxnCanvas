feature: 2026-05-20-web-energy-profile-panel
created: 2026-05-20

steps:
  - action: "Energy Projection And Fixture Command：扩展 Web shell DTO 和 fixture transport，支持 energy.compute success/error/warning paths"
    exit_signal: "ShellClient tests 能调用 energy.compute，返回 JSON-safe profile points；缺失 path 返回结构化错误"
    status: done

  - action: "Energy Panel UI Skeleton：新增 Energy Profile Panel，显示 options、empty state、profile summary、relative energy table 和 basic curve"
    exit_signal: "Workbench tests 能看到 profile table、curve 和 existing fixture profile points"
    status: done

  - action: "Command Integration：WorkbenchShell 编排 energy.compute，成功后更新 profile/counts，失败时显示 shell error"
    exit_signal: "测试能点击 Compute，profile id/path/unit/points 更新；无 active path 时 compute disabled"
    status: done

  - action: "I18n And Responsive Styling：新增双语文案和响应式样式，长 node/path/warning text 不撑破布局"
    exit_signal: "中文测试覆盖主文案；桌面/窄屏浏览器无水平溢出"
    status: done

  - action: "Verification And Scope Guard：跑 Web test/build、Python 单测、真实浏览器桌面/窄屏验证和范围 grep"
    exit_signal: "npm run test、npm run build、python3 -m unittest discover 通过；scope grep 未触碰 core energy/export/project save/cloud"
    status: done

checks:
  - item: "首屏无 session / active path 时 Energy Profile Panel 显示可见空态，Compute disabled"
    source: 验收场景
    status: passed

