feature: 2026-06-02-report-preview-delivery-qa-guides
created: 2026-06-02

steps:
  - action: "Evidence audit：核对 core/Web/E2E/docs 当前覆盖，列出哪些风险已被证明、哪些证据不足"
    exit_signal: "QA risks 都能指向现有或待补证据"
    status: done

  - action: "QA matrix docs：在开发者指南中新增收口矩阵，并写清 npm run test:e2e / npm run test:e2e:local-http 的报告导出职责"
    exit_signal: "开发者能从一个入口知道该跑哪些命令验证 CSV/SVG/preview/manifest/persistence/bundle/unsupported boundary"
    status: done

  - action: "User guide alignment：更新用户指南中保存位置、Preview 状态、.rxnflow.zip 备份和暂不支持格式说明"
    exit_signal: "用户能判断当前可导格式、browser-local 保存边界、备份方式和 PDF/PPTX/CDX 不支持原因"
    status: done

  - action: "Guard coverage：补或确认 Python/Web tests，固定 unsupported boundary、persistence skip、preview readiness、manifest no-bytes 和 CSV/SVG metadata"
    exit_signal: "targeted unit/component checks 通过，且没有新增方案外 writer/UI/schema"
    status: done

  - action: "Browser flow verification：运行 build/E2E，验证 fixture/local-http report export、bundle roundtrip、download/persistence 和窄屏布局"
    exit_signal: "相关 E2E 通过或有明确环境失败记录；无水平溢出和 console clean 由现有 helper 覆盖"
    status: done

  - action: "Acceptance sync：回写 architecture、roadmap、checklist 和 acceptance"
    exit_signal: "roadmap item done、YAML 校验通过，验收报告逐项映射证据"
    status: done

