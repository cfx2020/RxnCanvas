feature: 2026-05-04-import-registry-workflow
created: 2026-05-04

steps:
  - action: "Import 状态名词骨架：定义 request、batch、item、preview、selection 和 item status"
    exit_signal: "可构造一个包含 failed/needs_confirmation/registered item 的 ImportBatch"
    status: done

  - action: "Raw file 导入与 RawFile adapter：串接 ProjectStore.add_raw_file，并把 ProjectResource 转为 ParserRegistry 可解析的 RawFile"
    exit_signal: "导入单个 xyz source 后 batch item 包含 raw_resource 和 RawFile 可读路径"
    status: done

  - action: "Parse preview workflow：调用 ParserRegistry.parse，把 ParseResult/warnings 转成 needs_confirmation item；失败转成 failed item"
    exit_signal: "支持单文件正常解析、unsupported format 和批量部分失败"
    status: done

  - action: "Confirmation workflow：按 selection 调用 ChemicalRegistry.register，记录 registered object ids，并处理重复确认"
    exit_signal: "确认后 item 变成 registered，ChemicalRegistry 可读取对象；重复确认不重复登记"
    status: done

  - action: "范围守护与回归测试：覆盖不触碰 graph/energy/export、不新增 UI、fixture 兼容和既有 parser/registry/project 测试"
    exit_signal: "import workflow tests、project/parser/registry/fixture tests 全部通过"
    status: done

