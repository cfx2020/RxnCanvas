feature: 2026-05-14-platform-shell-state-restore
created: 2026-05-14

steps:
  - action: "Shell open 编排骨架：接入 ProjectContentStore，新增 project.open，并保持 project.load 为 manifest-only"
    exit_signal: "project.open(load_content=false) 创建 session 并返回 0 counts；project.load 既有语义和测试不回退"
    status: done

  - action: "Validation-gated restore：project.open(load_content=true) 按 validate -> load_snapshot -> restore services 顺序恢复项目内容"
    exit_signal: "有效 snapshot 恢复 objects/import batches/graphs/workspaces/profiles/artifacts；validation failure 返回结构化错误且不做部分恢复"
    status: done

  - action: "Session content collections：扩展 session state 保存多 graph/workspace/profile/artifact record，并选择 active content"
    exit_signal: "open -> save roundtrip 不丢失多个 graph/workspace/profile/artifact；既有 workspace/energy/export 命令能继续使用 active graph/workspace/profile"
    status: done

  - action: "Save content snapshot：新增 project.save_content，从当前 session 收集 ProjectContentSnapshot 并写回 ProjectContentStore"
    exit_signal: "project.save_content(session_id) 可保存当前会话；缺 session 或缺 project_path 返回结构化错误"
    status: done

  - action: "Export artifact record 转换：只把项目 exports/ 下的 runtime artifact 转成持久 record，其他情况返回 warning"
    exit_signal: "项目相对 exports 文件写入 ExportArtifactRecord；外部路径、bytes-only、checksum 失败不会 fatal，但返回 warning"
    status: done

  - action: "CLI project open：新增 CLI project open JSON 输出，并支持 manifest-only 打开"
    exit_signal: "python3 -m rxnflow.cli project open --json --project-path <path> 输出 restored summary；--manifest-only 输出 0 counts"
    status: done

  - action: "测试与范围守护：覆盖 restore/save/CLI/error/no-recompute/no-bundle 边界，并跑通现有测试"
    exit_signal: "新增测试和 python3 -m unittest discover 均通过；project.export_bundle/project.import_bundle 未出现"
    status: done

