feature: 2026-05-20-web-i18n-foundation
created: 2026-05-20

steps:
  - action: "I18n Contract And Catalogs：新增 SupportedLocale、MessageKey、catalogs、format/detect/persistence helpers"
    exit_signal: "单测覆盖 key completeness、fallback、zh detection、stored locale 和 {param} 插值"
    status: done

  - action: "Provider And Locale Switcher：新增 I18nProvider/useI18n，并在 App / WorkbenchShell 顶栏挂载 locale switcher"
    exit_signal: "component test 能看到默认英文 switcher，切换到中文后顶栏文案更新"
    status: done

  - action: "Workbench Copy Migration：WorkbenchShell 的主 UI 文案迁移到 t(...)"
    exit_signal: "fixture run、invalid command、status label、inspector 文案在英文测试中保持可查询，中文切换测试覆盖关键文案"
    status: done

  - action: "Project Sidebar Copy Migration：ProjectSidebar 和 sidebar validation message 迁移到 t(...) + message key/params"
    exit_signal: "create/open/save/error/bundle tests 仍通过；缺 stub message 能随 locale 切换"
    status: done

  - action: "Verification And Scope Guard：跑 Web test/build，真实浏览器桌面/窄屏验证语言切换无重叠"
    exit_signal: "npm run test、npm run build 通过；scope grep 确认未引入 i18n 库、cloud translation 或 route locale"
    status: done

