feature: 2026-05-21-graph-editor-viewport-controls
created: 2026-05-21

steps:
  - action: "Shell Viewport Contract：在 core platform shell、Web DTO 和 fixture transport 增加 workspace.set_viewport，并补 Python / ShellClient tests"
    exit_signal: "set viewport 返回 JSON-safe workspace projection；非法 viewport 不更新 graph；workspace graph nodes/edges/path 不变"
    status: done

  - action: "Viewport Helper：新增 Web viewport helper，覆盖 clamp、screen/graph 坐标换算、zoom、pan、fit、reset"
    exit_signal: "helper tests 覆盖 zoom clamp、pan delta、fit bounds、screen point conversion 和 fallback viewport"
    status: done

  - action: "Canvas Controls And Transform：GraphCanvas 接入 Pan/Zoom/Fit/Reset controls、viewport transform 和坐标换算"
    exit_signal: "component test 点击 zoom/fit/reset 发送 workspace.set_viewport；zoom 后 Add/Drop/Drag 坐标仍是 graph coordinates"
    status: done

  - action: "Pan Interaction：GraphCanvas 空白区域 pan drag 通过 interaction state 表达 transient drag，release 后提交 viewport"
    exit_signal: "component test 在 pan mode 拖动画布，发送 workspace.set_viewport；node drag 不触发 pan"
    status: done

  - action: "Verification And Scope Guard：跑 Web tests/build、Python 单测和浏览器主链路"
    exit_signal: "测试通过；Browser/Playwright 验证页面非空白、console clean、zoom/fit/reset/pan 有可观察变化；scope grep 未新增持久层、auto layout、undo 或第三方 diagramming 库"
    status: done

