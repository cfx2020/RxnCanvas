feature: 2026-05-08-project-content-validation-migration
created: 2026-05-13

steps:
  - action: "Validation report 名词骨架：落地 ValidationIssue、ValidationReport 与 MigrationPlan 的 JSON-safe 数据结构"
    exit_signal: "可构造 passed/failed report 和 no-op migration plan；report.ok 由 error issue 决定"
    status: done

  - action: "Index 与 section checksum 骨架：实现 validate_project 读取 index、校验 kind/path/checksum，并读取 section bytes 复算 checksum"
    exit_signal: "正常项目 report.ok=true；missing section、bad path、duplicate kind/path、canonical path mismatch、checksum mismatch 进入 issues"
    status: done

  - action: "Section codec 复用与跨 section 校验：复用现有 codecs 解码 section，并汇总 graph/workspace/import/profile/export 的引用错误"
    exit_signal: "坏 JSON、section schema/project mismatch、graph/workspace/import/profile/export 引用错误进入 report issues，正常 snapshot 不回退"
    status: done

  - action: "Manifest/resource 与 export artifact deep check：只读 manifest resources，校验 source_file_id/raw_resource_id warning，并读取 exports 文件复算 checksum"
    exit_signal: "source_file_id 缺锚点为 warning；artifact 缺文件或 checksum mismatch 为 error；validation 不写任何 artifact 或 manifest"
    status: done

  - action: "Migration entry：实现 migration_plan/no-op/unsupported 语义，并保持 load_snapshot 不做 silent migration"
    exit_signal: "project-content-v1 到 project-content-v1 返回 needed=false；未知 source/target 返回 structured error；不改写项目文件"
    status: done

  - action: "错误与范围守护：补齐 validation/migration tests，覆盖不写文件、不调用 parser/import/register/graph patch/energy/export/UI/CLI/cloud 边界"
    exit_signal: "新增 validation/migration tests 和现有全量 unittest 均通过"
    status: done

checks:
  - item: "ValidationIssue 包含 severity、code、message、target、details，且字段 JSON-safe"
    source: 名词契约
    status: passed

  - item: "ValidationReport 包含 project_id、schema_version、ok、issues、checked_at、summary，且 ok 由 error issue 决定"
    source: 名词契约
    status: passed

  - item: "ProjectContentMigrationPlan 包含 current_schema_version、target_schema_version、needed、steps、issues"
    source: 名词契约
    status: passed

  - item: "ProjectContentValidator 作为独立编排边界存在，不把 validation 聚合逻辑塞进 section codecs"
    source: 名词契约
    status: passed

  - item: "ProjectContentStore 暴露 validate_project(project_ref) 和 migration_plan(project_ref, target_schema_version='project-content-v1')"
    source: 名词契约
    status: passed

  - item: "validate_project 主流程按 index -> sections -> cross refs -> artifacts 顺序收集 issues"
    source: 编排骨架
    status: passed

  - item: "validation 内容不一致进入 ValidationReport.issues；不可恢复 backend internal I/O failure 仍保持 Result error"
    source: 跨层纪律
    status: passed

  - item: "重复 validate 同一项目得到稳定 issue code、target 和顺序"
    source: 跨层纪律
    status: passed

  - item: "validation 只读 .rxnflow/state、.rxnflow/manifest.json 和 exports/...，不写、不删、不修"
