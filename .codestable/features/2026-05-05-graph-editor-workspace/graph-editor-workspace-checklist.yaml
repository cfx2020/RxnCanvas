feature: 2026-05-05-graph-editor-workspace
created: 2026-05-05

steps:
  - action: "Workspace 状态名词骨架：定义 viewport、selection、palette item、preview、snapshot 和 node placement"
    exit_signal: "可构造包含空 graph、空 palette、默认 viewport 和空 preview 的 WorkspaceSnapshot"
    status: done

  - action: "Open workspace 与 snapshot workflow：串接 ReactionGraphService 创建/绑定 graph，并返回 workspace snapshot"
    exit_signal: "打开新 workspace 后 graph id/project id 可读，selection/viewport 默认值稳定"
    status: done

  - action: "Palette adapter：从 confirmed import items 或传入 ChemicalObject 生成 ObjectPaletteItem，并过滤未登记 item"
    exit_signal: "confirmed object 出现在 palette，needs_confirmation/failed item 不出现"
    status: done

  - action: "Graph edit bridge：实现 add_node、connect_nodes、set_active_path、apply_patches 到 GraphPatch 的转换和错误透传"
    exit_signal: "可通过 workspace API 生成 nodes/edges/paths，invalid object 或 missing node 返回现有错误语义"
    status: done

  - action: "Workspace-only 状态与 preview：实现 select、set_viewport 和 NetworkPreview 派生"
    exit_signal: "selection/viewport 更新不改变 graph；preview 能列出 active path、paths 和 disconnected nodes"
    status: done

  - action: "范围守护与回归测试：覆盖不触碰 parser/project-store/energy/export/UI，并保留 graph/import/fixture 回归"
    exit_signal: "workspace tests、graph tests、import workflow tests、energy tests、fixture tests 全部通过"
    status: done

