steps:
  - action: "名词契约：落 VibrationalMode、VibrationDisplacement、StructureMeasurement 与 vibration payload shape guard"
    exit_signal: "TypeScript/Python/embedded payload 能表达一个含 3 个原子、1 个 mode 的候选；atom count 不匹配的 mode 会被拒绝并产生 warning"
    status: done
  - action: "解析节点：接入 Python cclib vibration 读取、可靠 text fallback，并同步 embedded/renderer fallback 的最小 Gaussian extraction"
    exit_signal: "frequency fixture 的 full-file preview 返回 vibrationModes；无振动文件返回空 vibration payload 或 warning，整体 parse 不失败"
    status: done
  - action: "持久化节点：让 source parse clone、normalize、project roundtrip 与 desktop register path 保留合法 vibration payload"
    exit_signal: "保存项目 JSON 再 parse/open 后，同一 node 的 structure dialog 仍能读取原 mode；坏 payload 被清理或 warning 化"
    status: done
  - action: "3D 播放：普通 structure dialog 的 Play 按钮驱动 3Dmol viewer 振动动画"
    exit_signal: "有 mode 时按钮可用并能开始/停止动画；无 mode 时按钮 disabled 且不显示解释性大文本"
    status: done
  - action: "普通 3D 视图内联检查：按选中 1/2/3/4 个原子直接显示元素编号、键长、键角、二面角"
    exit_signal: "普通 3D 视图点击原子即高亮选择；左下角按选择数量显示 C1/H2、Å 距离或 ° 角度/二面角"
    status: done
  - action: "验证收尾：补 parser/unit/component 测试，运行 Web build/test、Python unittest，并做浏览器交互验证"
    exit_signal: "所有验收场景有测试或手动验证证据，结构弹窗 UI 不出现多余注释文字"
    status: done

