feature: 2026-05-02-project-storage-model
created: 2026-05-02

steps:
  - action: "名词与序列化骨架：定义 project-v1 manifest JSON 与 dataclass 转换边界"
    exit_signal: "ProjectManifest 可 round-trip 为 JSON dict 再还原"
    status: done

  - action: "Project Store 编排骨架：实现 create/load/save 三条 workflow，先不处理 raw file"
    exit_signal: "临时目录中创建项目后可重新 load 出等价 manifest"
    status: done

  - action: "Raw file 资源节点：实现 sha256、项目相对路径生成、文件复制和重复添加去重"
    exit_signal: "添加 raw file 后 manifest resources 增加一条，重复添加返回同一 resource"
    status: done

  - action: "错误路径与路径安全：补齐缺失 manifest、损坏 JSON、不兼容 schema、source missing、非法 resource path 等错误"
    exit_signal: "错误都返回 Result，不抛未分类异常"
    status: done

  - action: "测试覆盖与 fixture 兼容：补单元测试，并确认 core fixture vertical slice 仍通过"
    exit_signal: "Project Store 测试和现有 fixture 测试全部通过"
    status: done

