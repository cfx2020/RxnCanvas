steps:
  - action: "Workspace Projection And Fixture Commands：扩展 Web shell DTO 和 fixture transport，支持 workspace command success/error/idempotent paths"
    exit_signal: "ShellClient tests 能调用 open/add/connect/set_path，返回 JSON-safe workspace graph"
    status: done

  - action: "Graph Canvas UI Skeleton：新增 Graph Canvas component，显示 toolbar、empty/session state、nodes/edges/paths 和 preview panel"
    exit_signal: "Workbench tests 能看到 graph canvas、workspace preview counts 和 fixture nodes"
    status: done

  - action: "Command Integration：WorkbenchShell 编排 open/add/connect/set_path，成功后更新 workspace/graph counts，失败时显示 shell error"
    exit_signal: "测试能通过按钮添加对象节点、连接两个节点、设置 active path"
    status: done

  - action: "I18n And Responsive Styling：新增双语文案和响应式样式，长 node/object/path id 不撑破布局"
    exit_signal: "中文测试覆盖主文案；桌面/窄屏浏览器无水平溢出"
    status: done

  - action: "Verification And Scope Guard：跑 Web test/build、Python 单测、真实浏览器桌面/窄屏验证和范围 grep"
    exit_signal: "npm run test、npm run build、python3 -m unittest discover 通过；scope grep 未触碰 core graph/energy/export/cloud"
    status: done

