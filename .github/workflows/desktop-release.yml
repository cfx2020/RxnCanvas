name: Desktop verification and tagged beta release

on:
  pull_request:
    paths:
      - ".github/workflows/desktop-release.yml"
      - "rxncanvas/**"
      - "tests/**"
      - "web/**"
  push:
    branches:
      - main
    tags:
      - "v*-beta.*"
    paths:
      - ".github/workflows/desktop-release.yml"
      - "rxncanvas/**"
      - "tests/**"
      - "web/**"
  workflow_dispatch:
    inputs:
      notarize_macos:
        description: "Build a signed macOS artifact and submit it to Apple notarization."
        required: true
        default: false
        type: boolean
      unsigned_macos_beta:
        description: "Build an ad-hoc-signed, unnotarized macOS beta artifact for trusted testers."
        required: true
        default: false
        type: boolean

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  prepare-beta-release:
    name: Prepare tagged beta release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create draft prerelease for tagged builds
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-beta.')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "RxnCanvas ${GITHUB_REF_NAME#v}" --notes "Release build in progress." --draft --prerelease
          fi

  core-and-renderer:
    name: Core and renderer smoke
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install renderer dependencies
        working-directory: web
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install chromium
      - name: Run Python core tests
        run: python3 -m unittest discover
      - name: Audit locked Python engine dependencies
        run: |
          python3 -m pip install pip-audit==2.9.0
          python3 -m pip_audit -r web/engine-requirements.lock
      - name: Prepare development Python engine
        working-directory: web
        run: node -e "require('./scripts/dev-engine.cjs').prepareDevEngine()"
      - name: Run renderer tests
        working-directory: web
        run: npm run test
      - name: Run Electron regression tests
        working-directory: web
        run: node --test electron/*.test.cjs
      - name: Run parser performance budget
        working-directory: web
        run: npm run perf:parser
      - name: Audit all npm dependencies
        working-directory: web
        run: npm audit
      - name: Run bundle performance budget
        working-directory: web
        run: npm run perf:bundle
      - name: Run browser performance budget
        working-directory: web
        run: npm run perf:e2e
      - name: Run Electron shell smoke
        working-directory: web
        run: npm run desktop:smoke
      - name: Run release configuration smoke
        working-directory: web
        run: npm run desktop:release:smoke

  macos-unpacked-runtime:
    name: macOS unpacked runtime
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install renderer dependencies
        working-directory: web
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install chromium
      - name: Build unsigned local macOS app
        working-directory: web
        run: npm run desktop:pack
      - name: Launch packaged macOS app
        working-directory: web
        run: npm run desktop:runtime:smoke
      - name: Recheck release configuration and artifact shape
        working-directory: web
        run: npm run desktop:release:smoke

  windows-runtime-and-installer:
    name: Windows runtime and installer smoke
    needs: prepare-beta-release
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install renderer dependencies
        working-directory: web
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install chromium
      - name: Build Windows unpacked app
        working-directory: web
        run: npm run desktop:pack:win
      - name: Launch packaged Windows app
        working-directory: web
        run: npm run desktop:runtime:smoke
      - name: Build Windows installer and portable artifacts
        working-directory: web
        run: npm run desktop:dist:win
      - name: Install, launch, and uninstall Windows app
        working-directory: web
        run: npm run desktop:installer:smoke:win
      - name: Recheck release configuration and artifact shape
        working-directory: web
        run: npm run desktop:release:smoke
      - name: Generate Windows checksums and release manifest
        working-directory: web
        run: npm run desktop:release:manifest
      - name: Upload Windows artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: rxncanvas-windows-artifacts
          retention-days: 3
          path: |
            web/release/*.exe
            web/release/*.blockmap
            web/release/SHA256SUMS.txt
            web/release/release-manifest.json
            web/legal/*third-party-licenses.json
          if-no-files-found: error
      - name: Upload tagged Windows beta assets
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-beta.')
        working-directory: web
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $appVersion = node -p "require('./package.json').version"
          $installer = Get-ChildItem release -Filter "RxnCanvas Setup $appVersion.exe" | Select-Object -First 1
          $portable = Get-ChildItem release -Filter "RxnCanvas $appVersion.exe" | Select-Object -First 1
          if (-not $installer -or -not $portable) { throw "Windows release artifacts are missing" }
          New-Item -ItemType Directory -Force release-publish | Out-Null
          $setupTarget = "release-publish/RxnCanvas-$appVersion-windows-x64-setup.exe"
          $portableTarget = "release-publish/RxnCanvas-$appVersion-windows-x64-portable.exe"
          Copy-Item $installer.FullName $setupTarget
          Copy-Item $portable.FullName $portableTarget
          gh release upload $env:GITHUB_REF_NAME $setupTarget $portableTarget --repo $env:GITHUB_REPOSITORY --clobber

  macos-unsigned-beta:
    name: macOS unsigned beta artifact
    needs: prepare-beta-release
    runs-on: macos-14
    permissions:
      contents: write
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.unsigned_macos_beta) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-beta.'))
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install renderer dependencies
        working-directory: web
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install chromium
      - name: Build ad-hoc signed macOS beta artifacts
        working-directory: web
        run: npm run desktop:dist:mac:unsigned
      - name: Launch packaged macOS beta app
        working-directory: web
        run: npm run desktop:runtime:smoke
      - name: Recheck release configuration and artifact shape
        working-directory: web
        run: npm run desktop:release:smoke
      - name: Generate macOS beta checksums and release manifest
        working-directory: web
        run: npm run desktop:release:manifest
      - name: Upload macOS unsigned beta artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: rxncanvas-macos-unsigned-beta
          retention-days: 3
          path: |
            web/release/*.dmg
            web/release/*.zip
            web/release/SHA256SUMS.txt
            web/release/release-manifest.json
            web/legal/*third-party-licenses.json
            docs/user/macos-unsigned-beta.md
          if-no-files-found: error
      - name: Upload tagged macOS beta assets
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-beta.')
        working-directory: web
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          app_version="$(node -p "require('./package.json').version")"
          mkdir -p release-publish
          cp "release/RxnCanvas-${app_version}-arm64.dmg" release-publish/
          cp "release/RxnCanvas-${app_version}-arm64-mac.zip" release-publish/
          gh release upload "$GITHUB_REF_NAME" release-publish/* --repo "$GITHUB_REPOSITORY" --clobber

  publish-beta-release:
    name: Publish tagged beta release
    needs:
      - core-and-renderer
      - windows-runtime-and-installer
      - macos-unsigned-beta
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-beta.')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate beta tag against app version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          app_version="$(node -p "require('./web/package.json').version")"
          base_version="${tag_version%%-*}"
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]
          test "$base_version" = "$app_version"
          echo "RXNCANVAS_APP_VERSION=$app_version" >> "$GITHUB_ENV"
          echo "RXNCANVAS_RELEASE_VERSION=$tag_version" >> "$GITHUB_ENV"
          echo "RXNCANVAS_RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
      - name: Download user-facing release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p web/release-publish
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --dir web/release-publish --pattern "RxnCanvas-${RXNCANVAS_APP_VERSION}-*"
          test "$(find web/release-publish -maxdepth 1 -type f -name '*.exe' | wc -l)" -eq 2
          test "$(find web/release-publish -maxdepth 1 -type f -name '*.dmg' | wc -l)" -eq 1
          test "$(find web/release-publish -maxdepth 1 -type f -name '*-mac.zip' | wc -l)" -eq 1
          test -z "$(find web/release-publish -maxdepth 1 -type f -name '* *')"
      - name: Generate unified checksums and release manifest
        working-directory: web
        env:
          RXNCANVAS_RELEASE_DIR: release-publish
        run: npm run desktop:release:manifest
      - name: Verify publish payload
        working-directory: web/release-publish
        run: |
          sha256sum -c SHA256SUMS.txt
          node -e "const m=require('./release-manifest.json'); if(m.releaseTag!==process.env.GITHUB_REF_NAME||m.releaseVersion!==process.env.RXNCANVAS_RELEASE_VERSION||m.artifacts.some((a)=>a.name.endsWith('.blockmap'))) process.exit(1)"
      - name: Create or update GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node web/scripts/generate-release-notes.cjs > "$RUNNER_TEMP/release-notes.md"
          title="RxnCanvas ${RXNCANVAS_RELEASE_VERSION}"
          gh release upload "$GITHUB_REF_NAME" \
            web/release-publish/SHA256SUMS.txt web/release-publish/release-manifest.json \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$title" --notes-file "$RUNNER_TEMP/release-notes.md" --draft=false --prerelease

  macos-signed-notarized:
    name: macOS signed notarized artifact
    runs-on: macos-14
    if: github.event_name == 'workflow_dispatch' && inputs.notarize_macos
    env:
      CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require signing and notarization secrets
        run: |
          test -n "$CSC_LINK"
          test -n "$CSC_KEY_PASSWORD"
          test -n "$APPLE_ID"
          test -n "$APPLE_TEAM_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
      - name: Install renderer dependencies
        working-directory: web
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install chromium
      - name: Build signed macOS distribution artifacts
        working-directory: web
        run: npm run desktop:dist:mac
      - name: Launch packaged macOS app
        working-directory: web
        run: npm run desktop:runtime:smoke
      - name: Notarize and staple macOS artifacts
        working-directory: web
        run: npm run desktop:notarize:mac
      - name: Generate macOS checksums and release manifest
        working-directory: web
        run: npm run desktop:release:manifest
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rxncanvas-macos-artifacts
          path: |
            web/release/*.dmg
            web/release/*.zip
            web/release/SHA256SUMS.txt
            web/release/release-manifest.json
            web/legal/*third-party-licenses.json
          if-no-files-found: error
