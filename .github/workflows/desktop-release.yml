name: Desktop release verification

on:
  pull_request:
    paths:
      - ".github/workflows/desktop-release.yml"
      - "rxnflow/**"
      - "tests/**"
      - "web/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/desktop-release.yml"
      - "rxnflow/**"
      - "tests/**"
      - "web/**"
  workflow_dispatch:
    inputs:
      notarize_macos:
        description: "Build a signed macOS artifact and submit it to Apple notarization."
        required: true
        default: false
        type: boolean
      unsigned_macos_beta:
        description: "Build an ad-hoc-signed, unnotarized macOS beta artifact for trusted testers."
        required: true
        default: false
        type: boolean

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  core-and-renderer:
    name: Core and renderer smoke
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install renderer dependencies
        working-directory: web
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install chromium
      - name: Run Python core tests
        run: python3 -m unittest discover
      - name: Audit locked Python engine dependencies
        run: |
          python3 -m pip install pip-audit==2.9.0
          python3 -m pip_audit -r web/engine-requirements.lock
      - name: Run renderer tests
        working-directory: web
        run: npm run test
      - name: Audit production renderer dependencies
        working-directory: web
        run: npm audit --omit=dev
      - name: Build renderer
        working-directory: web
        run: npm run build
      - name: Run Electron shell smoke
        working-directory: web
        run: npm run desktop:smoke
      - name: Run release configuration smoke
        working-directory: web
        run: npm run desktop:release:smoke

  macos-unpacked-runtime:
    name: macOS unpacked runtime
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install renderer dependencies
        working-directory: web
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install chromium
      - name: Build unsigned local macOS app
        working-directory: web
        run: npm run desktop:pack
      - name: Launch packaged macOS app
        working-directory: web
        run: npm run desktop:runtime:smoke
      - name: Recheck release configuration and artifact shape
        working-directory: web
        run: npm run desktop:release:smoke

  windows-runtime-and-installer:
    name: Windows runtime and installer smoke
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install renderer dependencies
        working-directory: web
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install chromium
      - name: Build Windows unpacked app
        working-directory: web
        run: npm run desktop:pack:win
      - name: Launch packaged Windows app
        working-directory: web
        run: npm run desktop:runtime:smoke
      - name: Build Windows installer and portable artifacts
        working-directory: web
        run: npm run desktop:dist:win
      - name: Install, launch, and uninstall Windows app
        working-directory: web
        run: npm run desktop:installer:smoke:win
      - name: Recheck release configuration and artifact shape
        working-directory: web
        run: npm run desktop:release:smoke
      - name: Generate Windows checksums and release manifest
        working-directory: web
        run: npm run desktop:release:manifest
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rxnflow-windows-artifacts
          path: |
            web/release/*.exe
            web/release/*.blockmap
            web/release/SHA256SUMS.txt
            web/release/release-manifest.json
            web/legal/*third-party-licenses.json
          if-no-files-found: error

  macos-unsigned-beta:
    name: macOS unsigned beta artifact
    runs-on: macos-14
    if: github.event_name == 'workflow_dispatch' && inputs.unsigned_macos_beta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install renderer dependencies
        working-directory: web
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install chromium
      - name: Build ad-hoc signed macOS beta artifacts
        working-directory: web
        run: npm run desktop:dist:mac:unsigned
      - name: Launch packaged macOS beta app
        working-directory: web
        run: npm run desktop:runtime:smoke
      - name: Recheck release configuration and artifact shape
        working-directory: web
        run: npm run desktop:release:smoke
      - name: Generate macOS beta checksums and release manifest
        working-directory: web
        run: npm run desktop:release:manifest
      - name: Upload macOS unsigned beta artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rxnflow-macos-unsigned-beta
          retention-days: 30
          path: |
            web/release/*.dmg
            web/release/*.zip
            web/release/SHA256SUMS.txt
            web/release/release-manifest.json
            web/legal/*third-party-licenses.json
            docs/user/macos-unsigned-beta.md
          if-no-files-found: error

  macos-signed-notarized:
    name: macOS signed notarized artifact
    runs-on: macos-14
    if: github.event_name == 'workflow_dispatch' && inputs.notarize_macos
    env:
      CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require signing and notarization secrets
        run: |
          test -n "$CSC_LINK"
          test -n "$CSC_KEY_PASSWORD"
          test -n "$APPLE_ID"
          test -n "$APPLE_TEAM_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
      - name: Install renderer dependencies
        working-directory: web
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install chromium
      - name: Build signed macOS distribution artifacts
        working-directory: web
        run: npm run desktop:dist:mac
      - name: Launch packaged macOS app
        working-directory: web
        run: npm run desktop:runtime:smoke
      - name: Notarize and staple macOS artifacts
        working-directory: web
        run: npm run desktop:notarize:mac
      - name: Generate macOS checksums and release manifest
        working-directory: web
        run: npm run desktop:release:manifest
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rxnflow-macos-artifacts
          path: |
            web/release/*.dmg
            web/release/*.zip
            web/release/SHA256SUMS.txt
            web/release/release-manifest.json
            web/legal/*third-party-licenses.json
          if-no-files-found: error
