roadmap: rxnflow-web-project-portability
created: 2026-05-22

items:
  - slug: web-raw-input-persistence
    description: 保存浏览器选择的 raw output 文件到 active browser project inputs/raw/...，并更新 manifest raw resource
    depends_on: []
    status: done
    feature: 2026-05-22-web-raw-input-persistence
    minimal_loop: true
    notes: 最小闭环；让 Web 选择文件不再只是 preview payload，而是可随 browser-local project 和后续 bundle 被带走的 raw input anchor

  - slug: web-project-bundle-archive-adapter
    description: 建立 Web 侧 .rxnflow.zip archive helper，覆盖 allowed roots、entry 安全校验、summary 和 zip read/write tests
    depends_on: []
    status: done
    feature: 2026-05-22-web-project-bundle-archive-adapter
    minimal_loop: false
    notes: 已采用 fflate 作为 Web zip dependency boundary；helper-only，不启用 Sidebar UI，不写 repository，保持核心 Project Bundle allowed roots 与安全路径语义一致

  - slug: web-project-bundle-export
    description: 启用 Project Sidebar Export Bundle，把 active browser project 下载为 .rxnflow.zip，包含 .rxnflow/、inputs/raw/ 和 exports/
    depends_on: [web-project-bundle-archive-adapter]
    status: done
    feature: 2026-05-22-web-project-bundle-export
    minimal_loop: false
    notes: export 只读取 Browser Project Repository 当前 bytes；不会偷偷调用 Save Bridge Session 或生成缺失 artifact bytes

  - slug: web-project-bundle-import
    description: 启用 Project Sidebar Import Bundle，从安全 .rxnflow.zip 创建新的 browser-local project 并写入 bundle entries
    depends_on: [web-project-bundle-archive-adapter]
    status: done
    feature: 2026-05-22-web-project-bundle-import
    minimal_loop: false
    notes: Web import 第一版总是创建新 browser-local project，不覆盖、不合并、不自动 Open Bridge

  - slug: web-project-portability-roundtrip
    description: 验证 bundle import 后 Open Bridge、编辑/导出、Save Bridge Session、Export Bundle 的 repository/core session 同步口径
    depends_on: [web-raw-input-persistence, web-project-bundle-export, web-project-bundle-import]
    status: done
    feature: 2026-05-22-web-project-portability-roundtrip
    minimal_loop: false
    notes: 重点验证 inputs/raw、exports、Project Content state 和 bridge session 显式保存之间的边界

  - slug: web-project-portability-qa-guides
    description: 补桌面/窄屏/local-http E2E、错误 bundle 样例和 Web 项目备份/恢复用户指南
    depends_on: [web-project-portability-roundtrip]
    status: planned
    feature: null
    minimal_loop: false
    notes: 收口用户可见指南，明确 .rxnflow.zip 是手动备份/迁移，不是云同步或 live storage
