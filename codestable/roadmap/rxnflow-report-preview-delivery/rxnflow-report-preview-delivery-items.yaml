roadmap: rxnflow-report-preview-delivery
created: 2026-05-24

items:
  - slug: export-format-capability-matrix
    description: 建立导出格式能力表，统一 core/Shell/Web/docs 对 png/cdxml/xlsx/csv/svg/pdf/pptx/cdx 的状态、MIME、扩展名和 persistence guard
    depends_on: []
    status: planned
    feature: null
    minimal_loop: true
    notes: 最小闭环；先把格式能力口径集中，后续新增 CSV/SVG/PDF/PPTX/CDX 不再各端散改白名单

  - slug: export-csv-energy-table
    description: 复用 energy-table-v1 输出 CSV artifact，接通 Shell/Web download/persistence，并补 table/schema/docs 回归
    depends_on: [export-format-capability-matrix]
    status: planned
    feature: null
    minimal_loop: false
    notes: CSV 必须共用 EnergyTableColumn/EnergyTableRow，不新增独立字段清单；第一列仍为 structure name

  - slug: export-graph-snapshot-svg
    description: 从 graph/workspace projection 生成报告用 SVG graph snapshot artifact，覆盖 escaping、空图、active path 和 viewport bounds
    depends_on: [export-format-capability-matrix]
    status: planned
    feature: null
    minimal_loop: false
    notes: 首轮优先 projection-based SVG，避免把 DOM hover、pending edge、minimap draft 或 history stack 写进报告

  - slug: web-report-preview-panel
    description: 新增 Web 报告预览面板或 Report Export Panel preview mode，汇总 graph/profile/table/artifact readiness 与 warnings，覆盖桌面/窄屏
    depends_on: [export-csv-energy-table, export-graph-snapshot-svg]
    status: planned
    feature: null
    minimal_loop: false
    notes: Web 预览只消费 ShellResponse、WorkbenchDomainState 和 artifact projection，不在前端重算能量或导出 bytes

  - slug: report-composer-manifest
    description: 定义 ReportDocument/ReportSection/ReportAsset manifest，组合当前 energy diagram、table、graph snapshot 和 artifact metadata
    depends_on: [export-csv-energy-table, export-graph-snapshot-svg]
    status: planned
    feature: null
    minimal_loop: false
    notes: manifest 只保存 JSON-safe data 和 artifact references，不持有 Python object、React state、DOM node 或 Blob

  - slug: delivery-format-boundary-spike
    description: 调研并固定 SVG/PDF/PPTX/CDX 的依赖、运行位置、错误码和 unsupported UI 口径，能落地的格式转成后续 implementation item
    depends_on: [report-composer-manifest]
    status: planned
    feature: null
    minimal_loop: false
    notes: CDX 在没有可靠 writer/converter、license、平台可用性和测试策略前保持 unsupported

  - slug: report-preview-delivery-qa-guides
    description: 收口 unit/component/E2E、用户指南和开发者指南，说明 CSV、graph snapshot、report preview、composer manifest 和暂不支持格式边界
    depends_on: [web-report-preview-panel, report-composer-manifest, delivery-format-boundary-spike]
    status: planned
    feature: null
    minimal_loop: false
    notes: 覆盖 browser-local persistence、download MIME、bundle roundtrip、窄屏预览、unsupported format messaging 和文档入口
