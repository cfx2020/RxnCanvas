feature: 2026-05-06-energy-profile-persistence
created: 2026-05-06

steps:
  - action: "Energy profile codec 骨架：实现 EnergyProfile / EnergyOptions / warnings 的 energy-profiles-v1 往返"
    exit_signal: "profile id/graph_id/path_id、options 和 warnings 往返一致；坏 schema/project id 返回 Result error"
    status: done

  - action: "EnergyPoint 与 EnergyValue 严格校验：实现 point absolute/relative/missing_reason 和 EnergyValue shape/unit validation"
    exit_signal: "正常点和 missing point 往返一致；裸 energy、unsupported unit、point 语义冲突返回 Result error"
    status: done

  - action: "Graph/path 引用校验：基于 loaded ReactionGraph 校验 graph_id、path_id 和 point node 顺序"
    exit_signal: "缺失 graph/path/node 或 point sequence mismatch 返回 structured error"
    status: done

  - action: "ProjectContentStore 接入：将 energy_profiles section 改用长期 codec，保持 index/path/checksum 行为稳定"
    exit_signal: "ProjectContentStore.save_snapshot/load_snapshot 可恢复真实 EnergyProfile，且 chemical/import/graph/workspace sections 不回退"
    status: done

  - action: "错误与范围守护：覆盖重复 profile id、warnings shape、重复 save checksum，以及不碰 parser/import/registry/graph mutation/engine/export 的边界"
    exit_signal: "新增 energy profile persistence tests 和现有全量 unittest 均通过"
    status: done

