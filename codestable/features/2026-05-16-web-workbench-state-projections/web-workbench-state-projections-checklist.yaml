feature: 2026-05-16-web-workbench-state-projections
created: 2026-05-16

steps:
  - action: "Platform Snapshot Contract：在 Platform Shell 增加 workbench.snapshot 只读 command 和 JSON-safe projection helper"
    exit_signal: "Python 测试可从 fixture/project-open/import/workspace/energy/export session 读取 snapshot，并断言核心 counts / active ids / summaries 正确"
    status: done

  - action: "Read-only Scope Guard：补 missing session、manifest-only session 和 read-only 纪律测试"
    exit_signal: "测试证明 snapshot 不创建 session、不保存项目、不调用 parser/import register/energy/export"
    status: done

  - action: "Frontend Domain Projection Types：新增 WorkbenchSnapshotData、WorkbenchDomainState、WorkbenchUiState 和 projector"
    exit_signal: "前端单测能把 fixture snapshot 和 error response 投影成稳定 UI state"
    status: done

  - action: "Fixture Transport Integration：让 fixture transport 支持 workbench.snapshot，并让 WorkbenchShell 从统一 domain state 渲染"
    exit_signal: "点击 fixture command 后 UI 通过 snapshot/projector 展示 project/object/profile summary"
    status: done

  - action: "Frontend / Browser Validation：前端 test/build 通过，浏览器桌面和窄屏复核现有 shell 不回退"
    exit_signal: "npm run test、npm run build、浏览器 1280/390 viewport 验证通过"
    status: done

  - action: "收口：Python unittest、scope grep、CodeStable YAML、git diff 范围检查"
    exit_signal: "实现证据足以进入 acceptance"
    status: done

checks:
  - item: "PlatformShellService.run(ShellCommand(\"workbench.snapshot\", {\"session_id\": ...})) 对 fixture session 返回 ok=true"
    source: 验收场景
    status: passed

  - item: "snapshot response 可 JSON 序列化，且包含 command、session_id、project_id、active ids、counts、objects、workspace、profile、artifacts、warnings"
    source: 验收场景
    status: passed

  - item: "workbench.snapshot 缺少或不存在 session_id 时返回 ok=false，error.code 为 invalid_input，target 为 session_id"
    source: 验收场景
    status: passed

  - item: "project.open(load_content=True) 后调用 workbench.snapshot 能看到 restored object/graph/workspace/profile/artifact/import counts"
    source: 验收场景
    status: passed

  - item: "manifest-only session 的 snapshot 返回项目/session 基本信息，content counts 为 0"
    source: 验收场景
    status: passed

  - item: "import preview / register / workspace open / energy compute / export 后调用 snapshot，projection 与当前 session state 一致"
    source: 验收场景
    status: passed

  - item: "snapshot 不重新 parse raw files、不确认 import、不重新计算 energy、不导出报告、不保存 Project Content"
