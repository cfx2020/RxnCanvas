feature: 2026-05-15-parser-fixture-harness
created: 2026-05-15

steps:
  - action: "Corpus skeleton：建立 tests/fixtures/parsers/ 目录、manifest 和一个 synthetic MAPLE 或 XYZ fixture"
    exit_signal: "fixture 路径和 source policy 能被 loader 读取"
    status: done

  - action: "Snapshot projection：实现 Result[ParseResult] 到 JSON-safe snapshot dict 的投影，并生成首个 golden snapshot"
    exit_signal: "snapshot 文件稳定，字段覆盖当前最小对象摘要"
    status: done

  - action: "Assertion helper：实现 manifest loader、路径安全校验、source policy 校验、snapshot 比较和浮点容差"
    exit_signal: "helper 能定位字段差异并拒绝不安全 fixture"
    status: done

  - action: "Regression test wiring：新增 snapshot test 遍历 manifest 中可执行 fixture，并调用 ParserRegistry.default()"
    exit_signal: "python3 -m unittest discover 通过"
    status: done

  - action: "Scope guards：补测试确认 harness 不调用 ProjectStore / registry / graph / energy / export 等 runtime workflow"
    exit_signal: "范围守护和 YAML 校验通过"
    status: done

checks:
  - item: "tests/fixtures/parsers/manifest.yaml 存在，schema_version=parser-fixtures-v1"
    source: "验收场景"
    status: passed

  - item: "manifest 至少包含一个 support_status=supported 的 synthetic fixture"
    source: "验收场景"
    status: passed

  - item: "fixture source.kind=synthetic、redistributable=true、redaction=none"
    source: "source policy"
    status: passed

  - item: "fixture file 和 expected_snapshot 都是 corpus 目录内相对路径"
    source: "名词契约"
    status: passed

  - item: "manifest loader 能读取 fixture 列表，并把 parse_options 转成现有 ParseOptions"
    source: "编排骨架"
    status: passed

  - item: "snapshot test 用 ParserRegistry.default() 解析 supported fixture，返回 parse_ok=true"
    source: "验收场景"
    status: passed

  - item: "snapshot parser_id 与 manifest parser_id 一致"
    source: "验收场景"
    status: passed

  - item: "snapshot projection 包含 object_count、provenance.parser_id、objects[].label、method、atom_count、elements、energy_keys、energies、thermochemistry_keys 和 warning_codes"
    source: "名词契约"
    status: passed

  - item: "energy value 比较使用 manifest tolerances.energy_abs"
    source: "编排骨架"
    status: passed

  - item: "geometry sample 坐标比较使用 manifest tolerances.coordinate_abs"
    source: "编排骨架"
    status: passed

  - item: "普通测试运行不会重写 snapshot"
    source: "跨层纪律"
    status: passed

  - item: "只有显式 update=True 的 helper 调用才会写 snapshot 文件"
    source: "跨层纪律"
    status: passed

  - item: "manifest schema_version 不匹配时 loader 失败"
    source: "错误场景"
    status: passed

  - item: "fixture id 重复时 loader 失败"
    source: "错误场景"
    status: passed

  - item: "file 或 expected_snapshot 使用绝对路径、.. 或反斜杠逃逸 corpus 时 loader 失败"
    source: "错误场景"
    status: passed

  - item: "redistributable=false 但配置本地 file 时 loader 失败"
    source: "source policy"
    status: passed

  - item: "support_status=reference-only 的 fixture 不进入默认 snapshot test"
    source: "错误场景"
    status: passed

  - item: "本 feature 不新增 Gaussian / ORCA / MAPLE 真实第三方输出文件"
    source: "范围守护"
    status: passed

  - item: "harness helper 不放进 rxnflow.parsers runtime API，不改变 ParserRegistry / ParserPlugin contract"
    source: "范围守护"
    status: passed

  - item: "harness 不调用 ProjectStore、ImportRegistryWorkflow、ChemicalRegistry、ReactionGraphService、EnergyProfileEngine、ReportExportService、PlatformShellService 或 ProjectBundleService"
    source: "范围守护"
    status: passed

  - item: "不新增 CLI command、Web route、桌面入口或外部计算调用"
    source: "范围守护"
    status: passed

  - item: ".DS_Store、大型二进制轨迹、checkpoint、缓存文件不出现在 parser fixture corpus"
    source: "范围守护"
    status: passed
