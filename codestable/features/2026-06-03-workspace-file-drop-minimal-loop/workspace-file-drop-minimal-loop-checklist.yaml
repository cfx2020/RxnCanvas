    source: 名词契约
    status: passed

  - item: "Raw file drop payload 与 registered-object payload 分离，使用独立 MIME type"
    source: 名词契约
    status: passed

  - item: "external file drop 必须先写入项目 inputs/raw/... 并 merge manifest，再 preview/register/add node"
    source: 编排骨架
    status: passed

  - item: "object_count != 1 的 preview 不自动创建 graph node，并显示需要后续候选选择器的状态"
    source: 跨层纪律
    status: passed

  - item: "raw persistence、import.preview、import.register_all 或 workspace.add_node 任一步失败都停止后续步骤，不伪造半成品 node"
    source: 跨层纪律
    status: passed

  - item: "Project Sidebar active project 区新增 Project Files Panel 作为新主流程入口"
