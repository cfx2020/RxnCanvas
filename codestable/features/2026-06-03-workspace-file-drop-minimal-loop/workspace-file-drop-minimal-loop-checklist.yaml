feature: 2026-06-03-workspace-file-drop-minimal-loop
created: 2026-06-03

steps:
  - action: "Project File Projection：建立 ProjectFileEntry 派生逻辑和 Project Files Panel 静态 UI"
    exit_signal: "active project 下能列出 inputs/raw/... 和 exports/...；无 active project 时显示空状态"
    status: done

  - action: "Raw File Drag Payload：定义 project raw file / external file drop payload，GraphCanvas 能识别 raw file drop"
    exit_signal: "组件测试可验证 project file row drag payload 和 GraphCanvas drop position"
    status: done

  - action: "Drop Import Pipeline：接入 raw persistence、import.preview、single-object guard、import.register_all 和 workspace.add_node"
    exit_signal: "单对象 fixture 或 local-http 小文件 drop 后出现 ShellResponse graph node；失败时不创建节点"
    status: done

  - action: "Project File Status Feedback：把 stored/previewed/registered/used-in-graph/error 状态投影到 Project Files Panel"
    exit_signal: "成功 drop 后对应 project file 显示 used-in-graph；preview/register/add-node error 显示 code/target"
    status: done

  - action: "UX / I18n / Responsive：收紧左侧布局、按钮文案、长文件名和窄屏 Project Files 展示"
    exit_signal: "zh-CN/en-US 文案完整；桌面和窄屏布局无水平溢出"
    status: done

  - action: "Verification And Scope Guard：跑 unit/component/build/browser smoke，确认没有越界引入 parser/cloud/schema"
    exit_signal: "Web tests/build 通过；local-http smoke 可跑；scope grep 无违规依赖"
    status: done

