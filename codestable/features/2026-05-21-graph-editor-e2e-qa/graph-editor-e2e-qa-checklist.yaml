feature: 2026-05-21-graph-editor-e2e-qa
created: 2026-05-21

steps:
  - action: "Design And Roadmap Gate：落盘 design/checklist，回写 roadmap item 为 in-progress"
    exit_signal: "design status approved；checklist YAML 和 roadmap items YAML 校验通过"
    status: done

  - action: "Graph E2E Helpers：在 workbench-helpers.ts 增加 drag/drop、node drag、viewport、save/restore 和 overlay helper"
    exit_signal: "helper 只依赖 Playwright public API，spec 可读性提升，无 runtime import"
    status: done

  - action: "Desktop Graph Editor Matrix：新增或扩展 desktop E2E，覆盖 drag/drop、node move、edge/path edit、viewport、Save/Open Bridge restore"
    exit_signal: "focused graph editor E2E 通过，桌面截图产出"
    status: done

  - action: "Narrow Graph Editor Coverage：补 390x840 下 graph toolbar/canvas/preview/energy/export 可用、无水平溢出和截图"
    exit_signal: "focused narrow E2E 通过，窄屏截图产出"
    status: done

  - action: "Verification And Scope Guard：运行 Web tests/build、默认 E2E，按需 Browser smoke，更新 architecture/roadmap/acceptance"
    exit_signal: "测试通过；scope grep 未新增 runtime persistence / cloud / schema；验收报告落档"
    status: done

checks:
  - item: "npm run test:e2e 默认 fixture 模式包含 Graph Editor desktop matrix，覆盖 drag/drop、node drag、edge delete、path reorder、viewport controls、Save/Open Bridge restore"
    source: 验收场景
    status: passed

  - item: "Desktop matrix 中 Object Registry registered object 能拖入 Graph Canvas，drop 后显示新 node，且 console clean"
    source: 验收场景
    status: passed

  - item: "Desktop matrix 中已有 graph node 鼠标拖动后 bounding box 或 style 有可观察变化，并继续显示来自 ShellResponse 的 node id"
    source: 验收场景
    status: passed

  - item: "Desktop matrix 中 edge selection + Delete Selected 后 edge count 变为 0，node 仍保留，network preview 不由前端自行推断"
    source: 验收场景
    status: passed

  - item: "Desktop matrix 中 path order draft 上移/Apply 后 path order 文本变化，active/selected path 可见"
    source: 验收场景
    status: passed

  - item: "Desktop matrix 中 Zoom/Fit/Reset/Pan 有可观察 viewport 变化，Reset 后 zoom 回到 100%"
    source: 验收场景
    status: passed

  - item: "Desktop matrix 中 Save Bridge Session 后 reload/open project/Open Bridge 能恢复 graph workspace 可见状态，至少包含 node position、viewport、selected path 或 active path 的可观察断言"
    source: 验收场景
    status: passed

  - item: "Narrow 390x840 graph editor journey 能完成核心 graph interaction smoke，Graph Canvas、toolbar、preview、Energy Profile Panel 和 Report Export Panel 可见，无水平溢出"
    source: 验收场景
    status: passed

  - item: "每条新增/扩展 E2E 捕获 console warning/error、检查无 framework overlay、无水平溢出并附 screenshot"
    source: 验收场景
    status: passed

  - item: "local-http E2E 不复制完整 graph editor matrix，仍只验证真实 bridge smoke"
    source: 范围守护
    status: passed

  - item: "不新增产品 runtime command、Project Content schema、localStorage graph state、自动保存、云同步或账号系统"
    source: 范围守护
    status: passed

  - item: "npm run test 通过"
    source: 验收场景
    status: passed

  - item: "npm run build 通过"
    source: 验收场景
    status: passed

  - item: "npm run test:e2e 通过"
    source: 验收场景
    status: passed

  - item: "Browser dev preview 页面身份 / 非空白 / console smoke 有记录；复杂手势可由 Playwright 作为主证据"
    source: 验收场景
    status: passed
