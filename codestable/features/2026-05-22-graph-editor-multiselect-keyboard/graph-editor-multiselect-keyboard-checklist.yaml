steps:
  - action: "Selection Intent State：扩展 interaction helper 支持 replace/add/toggle/clear、rubber-band draft、keyboard intent 和 stale prune"
    exit_signal: "helper tests 证明 mixed selection 可 add/toggle/dedupe/prune，rubber-band release 可产出 node ids，keyboard intent 不处理输入控件"
    status: done

  - action: "GraphCanvas Multi-select UI：接入 Shift-click node/edge/path、rubber-band node selection、多选视觉和 single-item editor guard"
    exit_signal: "component tests 证明普通点击 replace，Shift-click add/toggle，框选多个 node 后只发送 workspace.select，multi selection 不误开单 item draft"
    status: done

  - action: "Keyboard And Nudge Orchestration：GraphCanvas scoped keydown 接入 Delete/Backspace/Escape/Arrow，WorkbenchShell 顺序执行 selected node nudge"
    exit_signal: "Delete/Backspace 发送 workspace.remove，Escape 发送空 workspace.select，Arrow 对 selected nodes 发送稳定 workspace.move_node 序列；输入框内按键不触发"
    status: pending

  - action: "Verification And Scope Guard：跑 Web tests/build、必要 Python tests、浏览器桌面/窄屏验证"
    exit_signal: "多选、框选、删除、清空和 nudge 可用；node drag/direct edge/pan/drop/click fallback 不回退；scope grep 未新增 core/schema/autosave/energy/export 变更"
    status: pending

