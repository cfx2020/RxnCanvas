    exit_signal: "单对象 catalog 可同时列出 energies 与 thermochemistry，旧 EnergyOptions constructor 仍可用"
    status: done

  - action: "Engine 选择规则：把能量取值切到 resolver，覆盖 auto fallback、explicit source、ambiguity 和 missing"
    exit_signal: "同一 key 双 section未显式 source 返回 ambiguity，显式 thermochemistry 可计算 profile"
