design: codestable/features/2026-06-03-public-fixture-import-preview-regression/public-fixture-import-preview-regression-design.md
status: ready

steps:
  - id: promoted-fixture-selector
    status: pending
    paradigm: contract
    description: 在 import preview regression 中接入 promotion adapter summary
    exit_signal: helper 返回当前 4 个 extxyz promoted fixtures，summary unresolved 为空

  - id: workflow-preview-regression
    status: pending
    paradigm: workflow-regression
    description: 对 promoted fixtures 跑 ImportRegistryWorkflow.import_files preview projection
    exit_signal: parser metadata、object_count、warnings、raw resource/provenance linkage 保真，registry 仍为空

  - id: shell-preview-regression-and-guards
    status: pending
    paradigm: shell-regression
    description: 对 promoted fixtures 跑 Platform Shell import.preview，并补 blocked/reference-only 反向 guard
    exit_signal: ShellResponse JSON-safe projection 保真，blocked/reference-only files 不进入 promoted preview set，no graph/energy/export/bundle

  - id: validation
    status: pending
    paradigm: validation
    description: 运行 focused tests、full unittest、YAML validation、scope diff
    exit_signal: tests.test_import_preview_parser_regression、python3 -m unittest discover、相关 YAML validation 和 git diff --check 通过

