feature: 2026-06-02-cclib-public-candidate-resolution
created: 2026-06-02

steps:
  - action: "Resolution summary contract：定义 cclib-data resolution summary dataclass/helper，从 inventory + decision ledger + support matrix 派生当前状态"
    exit_signal: "summary 覆盖 cclib-data-gaussian-orca 全部 source file ids，并正确分类 2 个 Gaussian candidate、2 个 ORCA candidate 与 2 个 reference-only files"
    status: done

  - action: "cclib-data resolution guards：补 focused tests，证明 candidates blocked with fallback、reference-only self anchors、promoted originals empty、candidate fetch request 可构造但不 fetch"
    exit_signal: "缺 decision、candidate fallback 缺失、reference-only anchor 缺失、未知 candidate format 或非 cclib-data source 会被拒绝/暴露"
    status: done

  - action: "Support matrix and docs guard：补 support matrix consistency tests 和 developer guide"
    exit_signal: "cclib-data public originals 未进入 executable fixture ids；docs 明确当前无 promoted cclib-data originals、NBO/large opt 仍 reference-only；focused tests 和 git diff --check 通过"
    status: done

