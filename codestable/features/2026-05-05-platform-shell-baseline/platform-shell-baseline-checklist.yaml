feature: 2026-05-05-platform-shell-baseline
created: 2026-05-05

steps:
  - action: "Shell DTO 骨架：落地 ShellCommand、ShellResponse、ShellArtifact、PlatformSession 和 JSON-safe 投影 helper"
    exit_signal: "未知 command / 空 command 返回 invalid_input；response 可 json.dumps"
    status: done

  - action: "App Kernel 装配：集中装配 ProjectStore、默认 ParserRegistry、ChemicalRegistry、ImportRegistryWorkflow、ReactionGraphService、GraphEditorWorkspaceService、EnergyProfileEngine、ReportExportService"
    exit_signal: "同一 kernel 内可创建 session，并能运行 fixture command 返回 project/profile summary"
    status: done

  - action: "Project / fixture commands：实现 project.create、project.load、fixture.run，fixture 可选导出 artifact"
    exit_signal: "project create 写 manifest；fixture.run 返回 object/graph/profile/artifact 摘要"
    status: done

  - action: "Import / workspace / energy commands：实现 session-scoped import preview/register_all、workspace open/add/connect/set_path、energy compute"
    exit_signal: "单进程 session 可从 import objects 打开 workspace、设置 path，并计算 EnergyProfile"
    status: done

  - action: "CLI entry：实现 python3 -m rxnflow.cli 的 argparse 映射、JSON stdout、非 0 错误 exit code 和 export-dir 文件输出"
    exit_signal: "subprocess 调用 fixture/project/import preview 命令可验证输出与 exit code"
    status: done

  - action: "Web payload adapter 与范围守护：实现 handle_platform_payload(dict) -> dict，补齐无 Web framework/desktop packaging 的反向测试和全量回归"
    exit_signal: "payload adapter 与 CLI 共用 command handler；现有核心 101 个测试继续通过"
    status: done

