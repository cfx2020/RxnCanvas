steps:
  - action: "Graph section codec：实现 reaction-graphs-v1 往返和 graph-level validation"
    exit_signal: "graph id/project_id、nodes、edges、paths、node positions、metadata 和 object refs 往返一致；坏 graph 返回 Result error"
    status: done

  - action: "Workspace section codec：实现 workspaces-v1 往返，保存 workspace-only 状态并派生 palette/preview"
    exit_signal: "workspace_id、graph_id、selection、viewport、active_path_id 和 updated_at 往返一致；palette/preview 不写入 JSON 但加载后可观察"
    status: done

  - action: "ProjectContentStore 接入：将 reaction_graphs/workspaces section 改用长期 codec，保持 index/path/checksum 行为不变"
    exit_signal: "save_snapshot/load_snapshot 可恢复真实 graph/workspace，且 chemical object section 仍按既有 codec 工作"
    status: done

  - action: "Graph service restore API：新增 list/restore graph 入口，直接恢复 graph map 并保留 id"
    exit_signal: "新 ReactionGraphService restore 后可 list_paths/apply_patch 继续编辑已恢复 graph"
    status: done

  - action: "Workspace service restore API：新增 list/restore workspace 入口，恢复 selection/viewport/active_path 并重新派生 snapshot"
    exit_signal: "新 GraphEditorWorkspaceService restore 后 snapshot、select、set_viewport 和 graph edit 继续可用"
    status: done

  - action: "错误与范围守护：覆盖坏 schema、project id mismatch、重复 id、缺失 object/node/edge/path/workspace 引用、非法 viewport，以及不碰 parser/import/energy/export 的边界"
    exit_signal: "新增 graph/workspace persistence tests 和现有全量 unittest 均通过"
    status: done

