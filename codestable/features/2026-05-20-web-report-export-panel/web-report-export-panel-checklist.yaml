feature: 2026-05-20-web-report-export-panel
created: 2026-05-20

steps:
  - action: "Export Projection And Fixture Command：扩展 Web shell DTO 和 fixture transport，支持 export.profile success/error/inline bytes paths"
    exit_signal: "ShellClient tests 能调用 export.profile，返回 JSON-safe PNG/CDXML/XLSX artifacts；missing formats/profile 返回结构化错误"
    status: done

  - action: "Report Export Panel UI Skeleton：新增 Report Export Panel，显示 format selection、include bytes、basename/title、empty state 和 artifact list"
    exit_signal: "Workbench tests 能看到导出面板、format controls、artifact metadata 和 inline download state"
    status: done

  - action: "Command Integration：WorkbenchShell 编排 export.profile，成功后合并 artifacts/counts，失败时显示 shell error"
    exit_signal: "测试能点击 Export，artifact count/list 更新；无 session/profile 或无 formats 时 export disabled/error 可见"
    status: done

  - action: "I18n And Responsive Styling：新增双语文案和响应式样式，长 artifact id/path/metadata 不撑破布局"
    exit_signal: "中文测试覆盖主文案；桌面/窄屏浏览器无水平溢出"
    status: done

  - action: "Verification And Scope Guard：跑 Web test/build、Python 单测、真实浏览器桌面/窄屏验证和范围 grep"
    exit_signal: "npm run test、npm run build、python3 -m unittest discover 通过；scope grep 未触碰 core export/project save/browser repository write/cloud"
    status: done

