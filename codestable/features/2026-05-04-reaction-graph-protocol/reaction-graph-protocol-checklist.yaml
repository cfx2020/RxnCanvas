feature: 2026-05-04-reaction-graph-protocol
created: 2026-05-04

steps:
  - action: "GraphPatch 名词骨架：定义 patch 操作载体和 graph service 入口"
    exit_signal: "可以构造 GraphPatch(\"add_node\", node=...) 并由 service 接收"
    status: done

  - action: "Graph 创建与状态骨架：实现 project-scoped create_graph、graph lookup 和 list_paths"
    exit_signal: "创建空 graph 后可列出空 paths，不影响 fixture graph"
    status: done

  - action: "Patch 应用节点：实现 add/update node、add/update edge、set_path"
    exit_signal: "一批 patches 可生成包含 nodes、edges、paths 的 graph"
    status: done

  - action: "删除与 invariant 校验：实现 remove、重复 id、缺失引用、object id 校验、失败不写回"
    exit_signal: "无效 patch 返回 Result 错误，原 graph state 保持不变"
    status: done

  - action: "测试与范围守护：覆盖正常、分叉、错误、回归和跨模块边界"
    exit_signal: "graph tests、registry tests、parser tests、fixture tests 全部通过"
    status: done

