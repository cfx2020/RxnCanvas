<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="RxnFlow app icon">
  <defs>
    <linearGradient id="surface" x1="126" x2="898" y1="104" y2="920" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4FEFF"/>
      <stop offset="0.54" stop-color="#DFF7F2"/>
      <stop offset="1" stop-color="#CDE9F5"/>
    </linearGradient>
    <linearGradient id="stroke" x1="190" x2="842" y1="262" y2="690" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0E927A"/>
      <stop offset="0.52" stop-color="#69A7FF"/>
      <stop offset="1" stop-color="#34BE8B"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="32" stdDeviation="42" flood-color="#0B4152" flood-opacity="0.24"/>
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#0B4152" flood-opacity="0.10"/>
    </filter>
    <filter id="nodeShadow" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#173847" flood-opacity="0.22"/>
    </filter>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="matrix(0 418 -418 0 510 480)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.92"/>
      <stop offset="0.58" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" rx="232" fill="url(#surface)" filter="url(#softShadow)"/>
  <rect x="54" y="54" width="916" height="916" rx="190" fill="none" stroke="#FFFFFF" stroke-opacity="0.72" stroke-width="28"/>
  <circle cx="512" cy="506" r="418" fill="url(#glow)"/>

  <path
    d="M214 590C310 378 450 356 548 486C648 618 720 648 820 410"
    fill="none"
    stroke="url(#stroke)"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-width="82"
  />
  <path
    d="M244 694C312 628 382 620 452 674C532 736 624 736 714 664"
    fill="none"
    stroke="#FFFFFF"
    stroke-linecap="round"
    stroke-width="28"
    stroke-opacity="0.72"
  />

  <g filter="url(#nodeShadow)">
    <circle cx="226" cy="590" r="92" fill="#587286"/>
    <circle cx="512" cy="362" r="104" fill="#F46F61"/>
    <circle cx="802" cy="422" r="92" fill="#36B881"/>
    <circle cx="386" cy="720" r="56" fill="#8EDEF0"/>
  </g>

  <circle cx="190" cy="534" r="28" fill="#FFFFFF" fill-opacity="0.72"/>
  <circle cx="472" cy="304" r="34" fill="#FFFFFF" fill-opacity="0.76"/>
  <circle cx="764" cy="364" r="28" fill="#FFFFFF" fill-opacity="0.72"/>
  <circle cx="342" cy="674" r="18" fill="#FFFFFF" fill-opacity="0.78"/>
